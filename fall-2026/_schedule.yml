  - num: 10
    slug: "10-writing"
    date: 2026-10-28
    part: 4
    title: "Writing"
    desc: "Writing is taught here, as a method rather than as advice. A piece of writing is built outline first — one topic sentence per paragraph, in order, before any prose exists. The fastest way to see that is backwards."
    goal: "Reconstruct the outline behind somebody else's paper. Build your own problem statement the same way, topic sentence by topic sentence, and hand it to a stranger who can follow it."
    a: "The method. A paper is built outline first: one topic sentence per paragraph, in order, before any prose exists. We start backwards — take a published paper apart into the outline that must have produced it. That is also this week's exercise, and the fastest way to see that good writing has a skeleton. Then forwards: outline, sketch, full text. Every written product in this course is submitted that way, so the argument is fixed before the sentences are. Then what a problem statement has to do. Scope, unit, population. The 'so what' in the first sentence, not the fourth paragraph. Then the section everybody gets wrong — identification: your design named, its assumption stated, and what would break it. And how to state a limitation without gutting your own project. Finally the failure modes: the topic with no question, hedging, the buried claim, the review that reviews without arguing."
    b: "Your own problem statement, written in the room. One topic sentence per paragraph, in order, and nothing else — no prose. Then swap with another team. They get your skeleton and nothing else, and they have to tell you what your argument is. Where they cannot, your argument is not there yet. Whatever survives that is the spine of your pitch next week, and of the proposal outline in November."
    builds: "Your problem statement, as an outline somebody outside your team could follow"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 4 on literature review and critical reading, and ch. 16 on writing up."
    reading: "TBD"

  - num: 11
    slug: "11-figures"
    date: 2026-11-04
    part: 4
    title: "Figures"
    desc: "Which figure answers which question, and why — distributions, time, space, comparison. Then what figures hide: aggregation, scale, binning, projection, area scaled by radius, chosen windows, counts where you needed a rate. Then the hard half nobody practises — an honest figure that still makes a point."
    goal: "Name the trick in a figure built to mislead you, and redraw it honestly without losing the point. Draw the one figure your own project lives or dies on, before you have the data to draw it with."
    a: "Three blocks. First, which figure answers which question. Distributions: a histogram, a density, a boxplot and a cumulative curve of the same column tell you four different things, and only some of them show you the second bump. Time: levels, indexed to a base year, or on a log scale — that choice is a claim about whether the reader should care about dollars or about growth rates. Space: a map of counts is a map of population unless you divided by something. Comparison: a sorted dot plot beats a bar chart nearly every time, and error bars are part of the estimate rather than decoration. Underneath all of it is one instinct — look at the data before you model it. Anscombe's quartet makes the case in one slide. Four datasets, the same means, the same variances, the same correlation, the same fitted line. One is a clean relationship, one is a curve, one is a line with a single outlier dragging it, one is a vertical stack where one point does all the work. The regression output is identical for all four. Second block: what figures hide. Aggregation, and the Berkeley graduate admissions case of 1973, where the university looked like it admitted women at a much lower rate overall while most departments taken one at a time did not. Scale, and axes that start where the author wanted them to. Binning, where the width of a histogram bin decides whether there is one group in your data or two. Projection, and Greenland the size of Africa. Area scaled by radius, which doubles the number and quadruples the ink. Cherry-picked windows. Counts where you needed a rate. Then the move that makes those useful: read a published figure for what it is not showing. Where is the denominator. What happened before the window starts. What do the subgroups do. What happened to the units that dropped out of the sample partway through. Third block, and it is the hard one. An honest figure that still makes a point. Honest does not mean neutral. You choose the comparison, sort the categories, show the raw points behind the summary, split one aggregate into small multiples, annotate the single number the argument turns on, and write the claim in the title instead of a label. Zeroing the axis is not a rule — for an index, a growth rate or a difference, zero is the wrong anchor. The test is whether the axis matches the quantity. And a finished figure has a sentence. If you cannot write the sentence, the figure is not finished."
    b: "Six figures, each lying a different way, one per team, twenty minutes. A truncated axis turning three points of satisfaction into a soaring bar chart. Two axes on unrelated scales manufacturing a correlation between ad spend and sales. Four quarters shown out of eight years. An aggregate rising while every single region falls. Circles where two million got twice the radius of one million, so the picture is four times bigger and not two. Complaints by state with no population underneath. Name the trick, say what the figure is entitled to claim, and redraw it honestly on the sheet. The redraw still has to make a point, and that is where most teams stall — naming the lie takes two minutes, replacing it takes the rest. Then one team is drawn at random to put its redraw at the front while the room attacks, and we draw again as far as the clock allows. Points for an attack that lands, and you have to name the trick rather than say you dislike the picture. Card 4 is the aggregation one and card 6 is the rate one. Those two are where the morning either landed or it did not. Then your own project, on paper, by hand. Draw the one figure it lives or dies on. Not a figure — the figure, the one a reader looks at before deciding whether to believe you. For most of you it is one of three: the picture showing that your variation exists, the picture showing your comparison group looked like your treated group before anything happened, or the picture showing the outcome move. You do not have the data yet, so you draw it empty. Both axes labelled with their units. What one point on it is. Which comparison is on the page. The claim written across the top as a sentence. Then draw it a second time as it would look if you are wrong. If the two drawings look the same, the figure cannot support the claim, and finding that out in November is cheap. Both drawings are handed in before you leave."
    builds: "Your project's key figure, drawn twice — as you expect it to look, and as it looks if you are wrong"
    books: "Zelazny, *Say It With Charts*, for the grammar of it. [Adams](https://doi.org/10.4135/9788132108498) ch. 11 for what a descriptive figure is doing."
    reading: "TBD"
    links:
      - text: "Figure critique cards"
        href: fall-2026/handouts/figure-tricks.qmd

  - num: 12
    slug: "12-speaking"
    date: 2026-11-11
    part: 4
    title: "Speaking"
    desc: "A talk is an outline with pictures. One claim per slide, and the claim is the slide title, not a label. Then the genre you actually face: pitching a research plan to people who will never read the paper, and who want to know what it costs and what they would do differently."
    goal: "Give a five-minute pitch whose argument the room can repeat back to you, on slides where every title is a claim. Answer a question you cannot answer without bluffing."
    a: "Same skeleton, new medium. Your talk is the outline from meeting 10 with pictures on it, and the pictures are the ones you rebuilt in meeting 11. Then the rule that does most of the work: one claim per slide, and the claim is the slide title. \"Methodology\" is a label. \"We compare stores on either side of a state border, so the weather and the season are the same on both sides\" is a claim. \"Results\" is a label. \"Basket size rose 4% in relaunch stores and did not move next door\" is a claim. Read your titles alone, top to bottom, with nothing else on the screen. You should have the argument. If you do not, the deck does not contain one, and no amount of delivery will put it there. Next, the thing everybody does and nobody defends. No bullet lists. A bullet list is an outline you stopped converting into sentences. The room reads it faster than you can say it, so you lose them for the rest of the slide, and you end up reading your own slide out loud to people who finished it. Then the two thirty-seconds. The first thirty seconds say what the question is and why anybody should care. Not your name. Not an agenda slide. Not thanking anyone. The last thirty seconds say what you want: in this genre, what will exist by May and what you need to get there. Everything in between is negotiable; those two are not. Then structure by length, because they are different objects. Five minutes is five slides — the question, the decision somebody makes differently, the design and the assumption carrying it, the data and how you actually get it, and what exists by May. Fifteen minutes is that same spine with room for the graph, one alternative explanation you considered and rejected, and the limitation stated plainly. It is not five minutes with more slides on the end. Then questions, which is where most pitches are actually won or lost. Three kinds arrive. Clarification: answer it in one sentence and move. Challenge: answer first, then explain, and do not relitigate the whole talk. And the one you cannot answer, which is the one worth practising. The answer is \"I don't know,\" followed by what would settle it. That sentence costs you nothing and a bluff costs you the room, because the people asking do this for a living and they can hear it. Know your numbers cold — sample size, the headline magnitude, where the data comes from, what it costs — because those are what get asked, and fumbling them undoes twenty good minutes. Then delivery, briefly, and this is not charm school. You will talk too fast, so rehearse standing up and out loud, once, with a clock; reading it in your head is not rehearsal and it is why teams over-run. Pause after a claim. Silence is what makes it land, and it is the only tool here that works on everybody. Stand where the room can see you, not behind the laptop and not in the projector beam, and never turn your back to read your own slide. And plan for the deck failing, because eventually it does. Know your first three claims by heart. Carry a PDF you can open from a phone. Be able to give the whole thing with no slides at all, which if the titles are claims you nearly can. Finally, the genre you actually face. You are pitching a research plan to people who will never read the paper. They are not checking your work. They are deciding whether to fund it, staff it, or wait. So they ask three things: so what would you do differently, how confident are you, and what does it cost. A talk built for a seminar answers none of them. I will give you the same two-minute pitch twice at the front — once with an agenda slide and bullet lists, once with claim titles and nothing else — and you will tell me which one you can repeat back."
    b: "Ten minutes of team check-in first, with one agenda item today: who says which slide at meeting 14, and who holds the clock. Then the shared case. I give a five-minute pitch from the front and it is deliberately bad — an agenda slide, a title called \"Results,\" four bullets a slide, the claim arriving on slide 4, forty seconds over, and one question answered with a bluff. Everybody scores the same pitch on the same card. What did the first thirty seconds do? Where did the claim first appear? What was the ask? Then the part that gets compared: every team rewrites my five slide titles as claims, working from the same five labels, and the best set goes on the screen next to mine. Same object, same constraint, so a good rewrite and a lazy one are visible side by side. Then the dress rehearsal, which is the rest of the hour. Order is drawn at random. Every team pitches its own project, three minutes, hard stop, five slides with claim titles. Then the room attacks — and it attacks the argument, not the delivery. Attacks come in four named types and nothing else counts: the data cannot answer this question, the assumption carrying the estimate is false in this setting, the comparison group is not comparable, or the answer would not change anyone's decision. \"You seemed nervous\" is not an attack and scores nothing. Points for attacks that land, as always. Each team leaves with four things in writing. Their actual clock time. The attack slips, each naming its type. One line from me. And the one that does the real work: before any discussion, two other teams write down in a single sentence the claim they think you just made, and you write down the claim you meant. You leave holding both. Where those two sentences differ is your meeting-14 rewrite, and you have three weeks to close the gap. Handed in before you leave: the five-slide dress-rehearsal deck, your written thirty-second opening and thirty-second close, and the claim-we-meant against claim-they-heard sheet."
    builds: "Your final-presentation deck, rehearsed and attacked — plus the gap between the claim you made and the claim the room heard"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 16 on presenting."
    reading: "TBD"
    due: "Proposal outline · Rate your teammates"

