        href: fall-2026/handouts/figure-guide.qmd
      - text: "Figure critique cards"
        href: fall-2026/handouts/figure-tricks.qmd

  - num: 12
    slug: "12-speaking"
    date: 2026-11-11
    part: 4
    title: "Speaking"
    desc: "A reader can skim, re-read and stop. A listener hears the talk once, at the speaker's pace. Who is listening, the message in one sentence, ten minutes for a research proposal, slides with one point each, delivery, and answering questions."
    goal: "Describe who will listen to a talk and what they will judge. State the talk's message in one sentence and place it in the first minute. Organize ten minutes for a research proposal, with spoken signposts and a planned close. Build slides with one point each. Plan your delivery and your rehearsal. Answer a question with a structure, including one you cannot answer."
    a: "Speaking to a room, after writing for readers (meeting 10) and drawing for them (meeting 11). A reader can skim, re-read and stop. A listener hears the talk once, in the speaker's order and at the speaker's pace. The meeting has six parts. The audience: who is listening, what they already know and what they will decide, with an experiment on how badly speakers predict what listeners follow. The message: one sentence a listener could repeat the next day, stated first, with its reasons under it. The structure: the first minute, a ten-minute budget for a research proposal, spoken signposts, the last minute and the handoffs in a team talk. The slides: one point per slide, and an experiment in which printing the narration on screen lowered what students learned. The delivery: pace and pause, where to look and stand, what nerves do and how to rehearse. The questions: three kinds of question, a structure for an answer, and what to say when you do not know. The running example is your own talk on December 2: ten minutes to an expert who is hearing your proposal for the first time and judging its importance, its soundness and its feasibility."
    b: "Everyone watches the same four recorded talks, and each student scores them on their own sheet: who the talk is for, its message and when it arrives, how it is organized, what the slides add, two delivery choices, and one thing the team should use on December 2. Teams then compare answers. Nobody rehearses their own presentation today."
    builds: "A scored sheet for four recorded talks, and six steps for your own talk on December 2"
    books: "[Shapiro](https://shapiro.scholars.harvard.edu/notes-and-lectures), \"How to give an applied micro talk\", short notes written for economists. Winston's lecture [*How to Speak*](https://www.youtube.com/watch?v=Unzc731iCUY) (MIT OpenCourseWare); its first ten minutes cover how to open a talk. [Adams](https://doi.org/10.4135/9788132108498) ch. 16 on presenting."
    chapters: "Adams ch. 16"
    reading: "TBD"
    due: "Proposal outline · Rate your teammates"

