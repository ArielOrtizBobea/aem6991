term: "Fall 2026"
meets: "Wednesdays, 2:00–4:30 pm"
parts:
  - id: 1
    tab: "Getting started"
    title: "Getting started"
    blurb: >
      Who is in the room, how the course works, and what you are here to
      build. You leave the first meeting knowing what everyone else is
      interested in, which is how the teams get formed.

  - id: 2
    tab: "Foundations"
    title: "Foundations"
    blurb: >
      What a causal claim is, where good questions come from, what you are
      allowed to do with other people's data, and the tools you will work
      through. Teams form here. So does the question.

  - id: 3
    tab: "Methods"
    title: "Research methods and designs"
    blurb: >
      What the standard models estimate and where uncertainty comes from.
      Then how estimates go wrong and what fixes them. Then the designs
      applied economists use to get a credible answer — what variation each
      exploits, what each assumes, and how each fails.

  - id: 4
    tab: "Communication"
    title: "Communicating the work"
    blurb: >
      Half of what you are graded on is whether somebody else can follow
      the argument. So it is taught, not assumed. One meeting on writing,
      one on figures, one on standing up and saying it. In all three,
      session B works on your own project.

  - id: 5
    tab: "Delivery"
    title: "Delivery"
    blurb: >
      The midterm, and then the pitch. A semester of weekly pieces becomes
      one proposal somebody could pick up and execute in January.

# Individual writing pieces, assessed together as the writing portfolio.
# Two of them are reverse-outlining: going from a finished text back to the
# outline that must have produced it. You cannot build an outline until you
# can see one.
# Team deliverables. One paper, reached in three milestones: a one-page pitch,
# then the whole argument as a detailed outline, then the written proposal.
# Nothing is submitted as a finished paper out of nowhere — the argument is
# fixed before the sentences are. The syllabus table is generated from this
# block, so the dates cannot drift from the meeting schedule.
deliverables:
  - num: 1
    name: "Project pitch"
    weight: "5 %"
    due_meeting: 9
    when: "in class"
    desc: "One page, and five minutes in front of the room. The question, why it matters, which archetype it is, and what data would answer it. This is the first time the project has to survive an audience, and the page is what you hand in."

  - num: 2
    name: "Proposal outline"
    weight: "15 %"
    due_meeting: 12
    desc: "The whole proposal as a detailed outline. One topic sentence per paragraph, in order, with the evidence noted underneath — the citation, the number, the figure you will point at. It has to cover the question, the identification strategy and the assumption carrying it, the unit and sample, the data and exactly how you get it, the threats to validity, and the work plan for the spring. Exchanged with a partner team at meeting 12, who referee it. If the argument does not work here, it will not work at 5,000 words."

  - num: 3
    name: "Research proposal"
    weight: "30 %"
    due_date: 2026-12-11
    desc: "~5 pages, written out from the outline you workshopped. The plan somebody could pick up and execute in January."

meetings:
  - num: 1
    slug: "01-introductions"
    date: 2026-08-26
    part: 1
    title: "Introductions"
    desc: "Who is in the room, and how the course runs. AEM 6991 produces a plan and AEM 6992 executes it, so everything you commit to this fall you live with in the spring. Then an afternoon of groups working out what they would like to explore, because I form the teams from what you tell each other."
    goal: "Say what you are interested in, in one line somebody else can repeat back to you. Hear the obstacles in it from people who have just met it. Know how this course works and what is due when."
    a: "Three blocks, and the first is the one the rest hangs off. First, what makes a good idea. You already have ideas, so the useful thing is not another way to generate them. It is a way to sort them quickly, before you spend a month on one that was never going to work. Four tests, and a good idea passes all four. Important: somebody is better off knowing the answer, and importance is the size of the decision that changes rather than the size of the topic. Feasible: you can get the data, in the time you have, with the skills on the team. Most projects die here, and they die in March because nobody checked in September. Novel: nobody has already answered it, and you know because you looked. Fit: your team can do the work and will still care in March. The four pull against each other, so a project is a choice about where to sit between them. Value gets its own treatment, because it decides who your reader is. Public value is shared and gets published. Private value can be kept and somebody pays for it. Both are fine here. Private value also decays: [McLean and Pontiff](https://doi.org/10.1111/jofi.12365) followed 97 published rules for beating the market and found they earned 58 percent less once in print. Second, the shapes a project can take. Seven of them, each with the question it asks and an example, because naming yours tells you what you have to go and get. Third, where ideas come from. From the world, a problem you saw. From previous work, a marginal change to something published. From data, a file you can reach worked backwards to a question. Each route leaves something different missing. The first lacks data, the second lacks novelty, the third lacks a decision. And working backwards from data is honest in exactly one form, which [meeting 1](sessions/01-introductions.qmd) gave you."
    b: "Ten-minute team check-in first, in writing, on the sheet on your table. Who is here. What you did since last week. What is stuck. Who does what next, by name and by date. In week three, nothing is stuck yet is an acceptable answer. Then your own project, which is the half you hand in. You write candidate questions and put each one through the four tests, and you kill the ones that fail. The tests you cannot run on your own work are run by another team, because every team thinks its own question matters and a stranger is the only honest judge of that. Your sheet goes in before you leave, and it is what your pitch gets built from. A question you kill in September is a month you do not lose in March."
    builds: "Your team's question sheet: candidate questions, each run through the four tests of a good idea, with the ones that fail killed on the record and the reason named"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 1 on what research is."
    reading: "TBD"
    due: "Research interest survey, on Canvas before meeting 2"

  - num: 2
    slug: "02-causality"
    date: 2026-09-02
    part: 2
    title: "Theory and causality"
    desc: "A theory is a set of assumptions that produces a prediction you could be wrong about. Empirical work can settle part of that and never all of it. Then causality proper: every comparison stands in for a world that did not happen, and the graph tells you which variables to condition on and which to leave alone."
    goal: "Draw the causal graph behind a claim somebody is acting on, name the failure in it, and say which variable you must condition on and which you must not touch. Leave with your team formed, its ground rules in writing, and a first graph of your own project that the room has heard."
    a: "Three blocks. First, theory. A theory is a set of assumptions that produces a prediction you could be wrong about. That is all it is, and it buys you four things. It tells you which comparison to make. It tells you what sign to expect. It tells you what to hold fixed. And it tells you what result would embarrass you. It is also the only thing that lets a number travel. A 40% lift measured in New York says nothing about Chicago unless you know the mechanism that produced it. Two worked examples, both from markets you will work in. [Akerlof's market for lemons](https://doi.org/10.2307/1879431) predicts that good used cars stay off the market, and it points straight at the fixes — warranties, certification, return policies. Then a dispute. [Spence's signalling model](https://doi.org/10.2307/1882010) and human capital both predict that a degree raises wages. They disagree about why. That disagreement tells you which comparison settles it: the jump at graduation, not the slope across years of study. Second, what empirical work can and cannot settle. It can measure a magnitude. It can rule out a sign. It can decide between two theories that predict different things about the same comparison. It cannot test a theory on its own. Every test is a joint test of the theory, the measure, the sample and the model, so a rejection never tells you which of the four broke. And no amount of data tells you what to want. Third, causality, which is the rest of the term. Counterfactuals first. Every unit has two outcomes: the one with the treatment and the one without. You only ever see one of them. That is [Holland's](https://doi.org/10.2307/2289064) fundamental problem, and it is a missing-data problem rather than a statistics problem. So every comparison you make is a stand-in for a world that did not happen, and the only question is whether the stand-in is any good. Customers on the loyalty app spend 40% more. The counterfactual is what those same customers would have spent without the app. It is not what the other customers spent. Then the picture. Causal graphs are arrows between variables, and they let you argue about identification before you own any data. A confounder causes both the treatment and the outcome, opens a back door, and has to be closed. A collider is caused by both, and conditioning on it manufactures an association that was never there. A mediator sits on the path you are trying to measure, and conditioning on it deletes the effect you came for. Close the back doors. Leave the front door alone. That is also why controlling for everything makes things worse. Every extra control is a claim about the graph, not a safety measure, and a kitchen-sink regression is a graph nobody drew. Then the cards, because seventy minutes of me is too many. Eight cards, each carrying a real causal claim somebody is acting on: a board paper, a consulting deck, an HR review closing a matter, a widely shared post. Every card is broken in a different way. In threes, draw the graph behind the claim, name the failure in this morning's vocabulary, then say what you would condition on and what you must leave alone. Card 3 is the hiring puzzle and it is a collider, because among the people you hired a strong test score and a strong interview trade off, since either one was enough to get in. Card 5 is the promotion gap and salary band is a mediator, so control for it and you have controlled away the thing you were looking for. Those two are where the morning either landed or it did not. Finish with the map. Every design in this course closes a back door in a different way. You will draw each one before you hear its name."
    b: "Your team is already yours. I email the teams on Tuesday night and there is a numbered sheet on each table, so the first three minutes are sitting down rather than listening to a list. Then ground rules, one page, signed by everyone, written while the team still gets along. Who does what. What happens when somebody misses a deadline. How you settle a disagreement, and who breaks a tie. Then your own project, on paper, by hand. Your team has a shared interest and not yet a question, so take the closest thing you have and draw it: the treatment, the outcome, the one back door you would have to close, and the one variable you must not touch. Then every team reports. Two and a half minutes each, hard stop, on a timer. Your question, and the graph you drew. Nine teams means you hear eight other projects before you leave, and this is the only afternoon all term when the whole room sees what everybody chose. Your sheet is disposable and it will be wrong, which is the point of drawing it in September. You redraw it when we reach research designs, and the version that survives the room is the figure in your identification section. Both sheets go in before you leave."
    builds: "Your team's ground rules, and the first causal graph of your own question — treatment, outcome, the back door you must close, and the variable you must not touch"
    books: "[Remix](https://mixtape.scunning.com/) ch. 3 on directed acyclic graphs and ch. 4 on potential outcomes. [Mostly Harmless](https://www.mostlyharmlesseconometrics.com/) ch. 1, *Questions about Questions*, is eight pages and needs no maths."
    reading: "TBD"
    due: "Your team's written ground rules — agreed and handed in today"
    links:
      - text: "Causal claim cards"
        href: fall-2026/handouts/causal-claims.qmd
      - text: "Project teams"
        href: fall-2026/handouts/02-teams.qmd

  - num: 3
    slug: "03-questions"
    date: 2026-09-09
    part: 2
    title: "Finding the question"
    desc: "Finding the question is the job, not the preamble to it. Where ideas come from, what makes an answer worth something to somebody, five shapes a project takes, and a map of what your question needs against what your team has. Then you map a shared case, and then your own."
    goal: "Say where your question came from, who would act on the answer or pay for it, and which of seven shapes it takes. Map what it needs against what your team has, name the row that binds and the date it has to close by, and say what the question becomes if it does not."
    a: "Five blocks, and the fifth is the one to keep. First, the last two cohorts, on one slide. Thirteen capstone titles from 2023 and 2026, and sixty seconds on paper to say what most of them have in common. Four of the five 2026 projects were the same project. Take a public signal anybody can download, regress a financial outcome on it, report a coefficient. Free data, no design, and nobody who would act on the number. I let you find that rather than saying it, because it lands harder when you have written it down than when I say it. Second, where ideas come from. Finding the question is the job, not the preamble to it. Most of your education has rewarded execution. This course rewards the part before it. In research, having the idea counts as much as answering it. In business the same skill has a different name: a proposition that has value. You cannot see the value of a new answer without knowing what is already known, and that is what reading is for. Ideas arrive by three routes. From the world: a problem you saw, or a decision somebody has to make. From a study: a result you would extend, contest or move to a new setting. From data: a dataset you hold, and a question worked backwards onto it. Each route leaves something different missing. The first lacks data, the second lacks novelty, the third lacks a decision. The data route is honest in one form only, and [meeting 1](sessions/01-introductions.qmd) gave it to you. Third, value. An answer has value when somebody is stuck without it. Public value is shared. Many people are better off, nobody can be excluded from the answer, so it is hard to charge the people who benefit and it gets published. Private value can be kept. One decider's choice changes, they can keep the answer, so somebody pays for it. Both are fine in this course. Private is easier to monetise. Public is easier to publish. And private value evaporates when it is published. [McLean and Pontiff](https://doi.org/10.1111/jofi.12365) followed 97 published return predictors and found their returns fell by more than half after publication. The test on your slate is naming the role that acts or the firm that pays. Fourth, the shapes and the filter. Five archetypes: evaluation, preference and pricing, prediction and risk, diagnosis and benchmarking, feasibility and landscape. One table: what each asks, what it can claim, and how it dies. The pitch asks for the shape by name. Then six ways a project dies, four of which are the ones a room names before anybody teaches them. Then the filter, which is four questions. Could a team of three to five execute this in one spring semester? Can you name the dataset, who holds it, and how you get it, checked rather than assumed? Could the answer come out either way? Would anybody act differently depending on it? A no on any one is fatal, and it is cheap to discover today. The third question was last week, and last week's two questions are not a fifth filter: they are how the third one gets teeth, and they are the comparison row of the map. The fourth question is the value block. The first two are the fifth block. And you write three candidates before you filter one, because a filter needs something to choose between. Fifth, the resource map. Start from what you have, not from the goal. That is [effectuation](https://doi.org/10.5465/amr.2001.4378020), the theory paper behind Sarasvathy's think-aloud study of 27 expert entrepreneurs. It is a small study, so take it as a habit that works rather than a law, and take the inventory it implies. The map is six rows against what the question needs: data, comparison, skills, time and money, permissions, people and access. Four columns: what the question needs, what you have and how you checked it, the gap, and who closes it by when or how the question moves. A have with no check counts as a need. The permissions row takes a rung from the [access ladder](data-sources.qmd) and nothing more, because [meeting 4](sessions/04-ethics.qmd) teaches the gates. Two live cases, built row by row on the screen after you have tried the first on paper. Does a brand's livestream lift its sales that week? The missing row is the stream schedule, and the question moves three times before the plan fails once. Does a plain-language nutrition label change what shoppers put in the basket? Nobody holds that data, so the rows that bind are money and the clock. One case binds on a file that does not exist and the other on a clock, and nothing but the map tells you which one you are in. The map is redrawn every time a row changes. That is not the plan failing. That is the plan working."
    b: "Check in first, in writing, nine minutes, on the sheet already in your envelope. Who is here. What you did since last week. What is stuck. Who does what next, by name and by date. In week three, nothing is stuck yet is an acceptable answer. Then the shared case. Every team maps the same question from the same two dataset cards: is flood risk priced into house prices, and did a local flood change that? Six rows, all of them, with how you checked each thing you claim to have. Then the two lines at the bottom: the row that binds and its date, and what the question becomes if it does not close. The same object for nine teams, so the maps are comparable. Three things about these datasets are easy to miss, and the draw is where you find out whether you missed them. One team is drawn at random to read its map aloud, blanks included, while the room attacks. Naming a specific row that is blank, unchecked or wrong is an attack. Calling the whole map thin is not. A point for every attack that lands, and I close with whichever trap nobody found. Then your own project, which is the half you hand in. Three candidate questions, and label the route of each. Each with its archetype and the role of the person who would act on the answer or pay for it. One of them run through all four filters in writing, not in your heads. A second crossed out with the filter that killed it named, because a team that kills nothing has not used the filter. For the third, the one row that would kill it. Then a resource map for the strongest survivor, with every gap owned by somebody and dated, or the question moved. The last lines on the sheet are the ones I read first: the row that binds and the date it has to close by, and what the question becomes if it does not. A second team defends its own map if the clock allows. Four sheets go in your envelope before you leave: the check-in, the shared map, the slate and your own map. The slate and the map are what your pitch gets built from. A question you kill in September is a month you do not lose in March."
    builds: "Your team's question sheet, three candidates each labelled with its route, its shape and who acts or pays, run through the four filters with one killed on the record, and the resource map of the survivor with the row that stops them dated and the question it becomes if that row does not close"
    books: "[Adams, Khan, Raeside and White (2007)](https://doi.org/10.4135/9788132108498), Research Methods for Graduate Business and Social Science Students, ch. 3 on the research cycle and ch. 4 on literature review and critical reading."
    reading: "TBD"
    links:
      - text: "Resource map and question slate"
        href: fall-2026/handouts/resource-map.qmd
      - text: "Team check-in sheet"
        href: fall-2026/handouts/check-in.qmd
  - num: 4
    slug: "04-ethics"
    date: 2026-09-16
    part: 2
    title: "Ethical and legal obligations"
    desc: "Three topics. Human subjects and the IRB: where the rules come from, when they apply, and the branch of Cornell's decision tree your project sits on, because many projects in this room involve no people at all. Ethical research practices: fabrication, falsification and plagiarism, the p-hacking and selective reporting that fall short of them, and how every case was caught. Data-use agreements and licences: the contracts the university signs, the licences on data Cornell already holds, and the terms of service you accepted by clicking."
    goal: "Say whether your project involves human participants, and defend the answer with the branch of Cornell's decision tree it sits on. Say what p-hacking is, and what the honest version of a three-specification analysis looks like. Say whether any data source you named needs a data-use agreement or carries a licence, and who signs."
    a: "The hour opens with why it exists. A study is a question, the data and the methods, and two more things decide whether it can happen and whether it survives: ethical practice and legal obligation. They are different tests. Tuskegee broke no law for forty years, the Facebook experiment broke no law and drew an expression of concern from the journal, reporting one regression out of three breaks no law and has ended careers, and scraping a public website is rarely a crime and frequently a breach. Then three parts. First, human subjects and the IRB, told without assuming you know any of it, and without assuming your project has any: the Nazi medical experiments and the Nuremberg Code, whose first rule is that the voluntary consent of the subject is absolutely essential; the Tuskegee syphilis study, which ran from 1932 to 1972 and was stopped by a reporter; the [Belmont Report](https://www.hhs.gov/ohrp/regulations-and-policy/belmont-report/index.html) it produced, with its three principles of respect for persons, beneficence and justice, and the review board that applies them; and Facebook's [mood experiment](https://doi.org/10.1073/pnas.1320040111) on 689,003 users, which involved no needle. The first question for the room is what is different between the Facebook experiment and an ordinary A/B test. Then when the IRB applies. Two questions decide it: is it research, and are there human participants, which includes identifiable rows you never collected yourself, and many projects in this room answer no to the second. Cornell's own [decision tree](https://researchservices.cornell.edu/sites/default/files/2019-05/IRB%20Decision%20Tree.pdf) has a row for class projects, a branch for studies whose outcomes stay with one organisation, which is last week's private value, and a second page for existing data that asks whether you can link a row to a living person, not what the vendor calls the file, and [removing the names](https://dataprivacylab.org/projects/identifiability/paper1.pdf) is not de-identification. The second question for the room is which of five projects needs an application, and two need nothing. For the teams that answer yes, the levels of review in Cornell's [own weeks](https://researchservices.cornell.edu/resources/life-cycle-irb-protocol) and the rule that you do not decide you are exempt. For the teams that answer yes, [CITI training](https://researchservices.cornell.edu/resources/irb-training), with every member's certificate on Canvas before meeting 6; for the others, the week the plan changes. Second, ethical research practices, opened with the case of Diederik Stapel. Fabrication, falsification and plagiarism, with Francesca Gino as the falsification case; then the practices that fall short of misconduct and are far more common, p-hacking, HARKing and selective reporting, with Brian Wansink as the case from this school; then how every case was caught, by outsiders and from the file, and what each one cost. A fabricated citation is a fabrication, and two New York lawyers learned in 2023 that it was the AI's fault is not an excuse. The third question for the room is whether running three specifications and reporting the one that worked is misconduct. Third, data-use agreements and licences, opened with Cambridge Analytica, which reached [up to 87 million profiles](https://about.fb.com/news/2018/04/restricting-data-access/), and three more cases where data was used beyond what was agreed: the Havasupai blood samples, the Royal Free records given to DeepMind, and AOL's search logs. A data-use agreement is a contract the university signs through the [Office of Sponsored Programs](https://researchservices.cornell.edu/resources/exchange-commercially-unavailablerestricted-data), with clauses on review, destruction and redistribution, and an employer's data brings an NDA, an ownership question and a conflict to disclose. A licence is a contract too, and most of what Cornell pays for, WRDS and Compustat included, forbids commercial use. Terms of service are the same species: scraping is rarely a crime and frequently a breach. And where the file may live: Cornell's rule keeps anything at [moderate risk or above](https://it.cornell.edu/regulated-data) out of public AI tools, which is next week's session."
    b: "Ten minutes of team check-in. Then two questions about the research idea you are proposing, answered on the ethics-and-access checklist and signed by every member. Does your project need an IRB application? Yes, no or ask the office, with the branch of Cornell's decision tree that says so. Does any data source need a data-use agreement? One row per source: who holds it, whether it is public, licensed through Cornell or restricted, and whether an agreement is needed before it moves. Then every team reads its two answers to the room, the room names a gate the team missed, and I rule. Many teams will find they need neither, and a team that needs neither has to be willing to say so. The teams that need something find out today, which is the whole reason this meeting is in September. Homework, for the teams that answer yes or ask on the IRB question: CITI human-participants training, with every member's certificate on Canvas before meeting 6. For the others, nothing until the plan changes."
    builds: "Your project's ethics-and-access checklist, signed by every member: whether it needs an IRB application, whether any data source needs a data-use agreement, and the date the slowest gate has to start"
    due: "CITI human-participants training, for teams whose project involves human participants — certificate on Canvas before meeting 6 (September 30)"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 2 on research ethics."
    reading: "TBD"
    links:
      - text: "Ethics-and-access checklist"
        href: fall-2026/handouts/ethics-checklist.qmd
      - text: "Team check-in sheet"
        href: fall-2026/handouts/check-in.qmd
      - text: "Permissions and ethics"
        href: fall-2026/permissions.qmd

  - num: 5
    slug: "05-tools-and-ai"
    date: 2026-09-23
    part: 2
    title: "Coding tools and AI"
    desc: "Every serious analysis is code, whether or not you wrote it. \"Use AI\" is four different things and they fail differently — only one of them produces output you can check. Then the practical business of getting a file at all: what Cornell already pays for, what an API is, and why scraping is the last resort dressed up as the clever one."
    goal: "Choose the right AI modality for a data job, and say why. Interrogate a file you did not create — through an assistant, without reading the code — and catch what is wrong with it before it reaches your proposal."
    a: "Four blocks. First, code. Not how to write it — what it is, and why you cannot avoid understanding it. Why there are several languages: R grew out of statistics, Python out of general programming, Stata out of applied economics. SQL is not the same kind of thing at all. It is a way of asking questions of data you never load onto your own machine. Then the argument that matters here. Every serious analysis is code, whether or not you wrote it. A spreadsheet stops being enough at a moment you can name: when you join two files, when the same cleaning has to run again on next month's extract, or when somebody asks what changed between version 4 and version 7. Two cases make that better than any principle. Reinhart and Rogoff's growth result averaged fifteen countries where the formula should have covered twenty, and it had already been quoted in austerity debates before anyone opened the sheet. Public Health England lost 15,841 COVID cases in 2020 because an old Excel format stops at 65,536 rows and says nothing at all when it runs out. Neither is a statistics error. Both were invisible in a spreadsheet and would have been visible in code. You will drive code through an assistant. But you cannot check what you cannot read at all. Second, the four things people mean by \"use AI\". They fail differently, and that is the whole point. Chat answers from memory. It invents citations that look real — right journal, plausible authors, a DOI that resolves to something else. File upload with code execution is different in kind: the assistant writes real code, runs it on the file you gave it, and shows you both. That is the only modality where the output is checkable, and it is the one this course uses. Retrieval answers from documents you supplied, which bounds the invention without removing it. Agents act over many steps without stopping to ask. Pick the wrong column at step two and by step nine it is buried under eight correct-looking operations. So you choose the modality by whether you will be able to tell it was wrong. Third, the skill this course actually grades: judging an answer without reading the code that produced it. Five checks, and they take four minutes. Row counts across a join — a join that grew has a duplicate key, and a join that shrank quietly dropped the rows that did not match, which is how a result ends up being about a different population than you think. Totals against a published figure. Five raw records read by hand, with your eyes, before any summary. Orders of magnitude: 58 and 58,000 are different claims about household income, and the gap is usually a units column nobody mentioned. And the one nobody runs — ask for the same number a second way and see whether it comes back the same. Then what you must not upload. Restricted, IRB-covered and DUA-covered data do not go into a public chatbot. That is meeting 4, and this is the week it stops being abstract. Fourth, getting hold of data at all. Start with what Cornell has already paid for — Dewey, WRDS, Capital IQ, IBISWorld — and the free public sources that need no login: FRED, IPUMS, EDGAR, data.census.gov. Then the three routes to a file. Downloading is boring and usually fastest. An API is a documented door: a key, a rate limit, stable field names, and a record of what you asked for. Scraping is the last resort dressed up as the clever one, and I will break one in front of you. The page changes and the code returns nothing. The rate limit bites. Records go missing without a single error message. The terms of service say no. And nothing you pulled could be reproduced by anybody next week. Going to a county assessor yourself is worth it only when you need one county in unusual depth, or a field the national vendor does not carry. Last, reproducibility, at the level of awareness rather than tooling. Keep the raw file untouched. Keep one path from raw to result. Keep a note saying where the raw came from and on what date. The test is simple: could a teammate get your number on a different laptop next week? If not, you do not have a result. You have a screenshot."
    b: "Ten-minute check-in first. Then everybody works the same file. `store-weeks.csv` is a retail extract with four things planted in it. A block of store-weeks is duplicated, so every total is too big. Twelve prices are recorded in cents while the rest are in dollars. Missing values are coded −99, which a mean will swallow without complaint. And one store stops reporting in July, so a year-on-year comparison silently compares nine months against twelve. You find them by driving an assistant with file upload. You do not find them by reading the file. Twenty minutes. Then the half that is actually graded, which is the second question on the sheet: which of the five checks would have caught this one? A team that finds a fault and cannot name the check has not learned the thing. Then I put up a transcript of an assistant getting this same dataset confidently wrong, and the room says where it went off the rails. Second half, your own data. Take the dataset your team is currently betting on and run the same interrogation. What is one row. How many rows are there. What is missing, and how is it coded. What changed over time. And one number checked against a source outside the file. That page is your data interrogation sheet, and it is handed in before you leave, with three lines at the bottom: what you could not answer today, who chases it, and by when. If your team has no file yet, your sheet is the shortest named route to one — which source, which access route, how many days or months, and what plan B is. Not having the data in September is fine. Not knowing how you get it is not."
    builds: "Your candidate dataset interrogated — or, if you do not hold one yet, the named access route and plan B for getting it"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 7 on secondary data collection."
    reading: "TBD"
    reschedule: "Instructor traveling — this meeting is held remotely"

  - num: 6
    slug: "06-models-uncertainty"
    date: 2026-09-30
    part: 3
    title: "Models and uncertainty"
    desc: "What the standard models estimate, and how to read a coefficient in the units of the problem. Where uncertainty comes from, and what a p-value is not. Then the distinction that decides half your projects: explaining or predicting."
    goal: "Read a coefficient in the units of the problem. Say what a p-value does and does not tell you. Tell an explanatory question apart from a predictive one."
    a: "Linear regression, non-linear models, count models. Described, not derived. What each estimates, and how to read a coefficient in the units of the problem. Then uncertainty. Residuals and errors, sampling variation, what a standard error actually states, and where p-values come from. More usefully: what they are not. Finally the distinction that decides half the projects in this room. Explaining is not predicting. A model can predict well and still tell you nothing about what to do."
    b: "Ten minutes of simulation first, driven from the front. Draw from a world you control. Watch the p-value distribution under the null. Move the sample size and the variation, and watch it shift. Then fit the same world in and out of sample, and watch an excellent-looking model fail on data it has not seen. Nothing to install. Then the cards. Each team gets an analyst who ran something and said something about it, and every one overclaims differently. A count outcome fitted by OLS and predicted below zero. A 0.03% lift called highly significant across two million users. A wide interval called no effect. An elasticity estimated off two price changes in three years. A churn probability of 112%. Work out what they are actually entitled to claim. Then a team is drawn at random to defend that while the room pushes back. The last line on the sheet is the one that matters: is your own project at risk of the same error?"
    builds: "The overclaim your own project is most at risk of making"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 11 on descriptive statistics and ch. 12 on correlation and regression."
