# AEM 6991 · Fall 2026 — single source of truth for the meeting schedule.
#
# The front-door table, the syllabus table, the _quarto.yml sidebar, and the
# session pages are all generated from this file by _tools/build_site.R.
# Edit here and re-run; never edit the generated artifacts by hand.
#
# To start a new year: copy this file into the new offering's folder, shift
# the dates, and edit forward. The diff is the year-over-year change log.
#
# Fields
#   num       meeting number; omit for a non-meeting row (recess)
#             (the key is `num`, not `n` — YAML 1.1 reads a bare `n` as false)
#   date      ISO date of the meeting
#   part      part of the course this meeting belongs to
#   title     full title, used as the session page heading
#   short     compressed title for the sidebar (falls back to title)
#   slug      session page filename, fall-2026/sessions/<slug>.qmd
#   desc      one-to-two sentence description for the front-door table
#   goal      what a student can DO after this meeting. One sentence,
#             written as a capability, not a topic list.
#   a         session A (2:05–3:15) — concept, with worked examples
#   b         session B (3:35–4:30). THE RULE, in two halves:
#             (1) TEST what session A taught, on a shared case — everyone
#                 works the same object, so teams can be compared and
#                 corrected, and a deliberately bad example can be used.
#             (2) APPLY it to your own project — which is what makes the
#                 project advance a piece a week instead of being written
#                 in November.
#             Half (2) is the artifact submitted before you leave, and
#             `builds:` records what it contributes. Logistics — team
#             formation, peer evaluation, presentations — ride along
#             inside B; they never replace it. Deliberate exceptions:
#             meeting 11 (A is the midterm) and meeting 14 (the pitch).
#             Every session B opens with a ten-minute team check-in.
#
#             THE DEFENCE, used in meetings 2, 3, 7 and 8: every team
#             works its own card at the same time, then ONE team is drawn
#             AT RANDOM to defend at the front while the rest of the room
#             attacks. Draw again, and again, as far as the clock allows.
#             Random is the whole point — nobody knows whether they are
#             up, so every team has to be ready, and being ready is the
#             thing being taught. Points for attacks that land, as in the
#             meeting-1 relay.
#   builds    what this meeting's session B contributes to the team's
#             final design paper. Generates the "how your paper gets
#             built" table in the syllabus.
#   quizzes   how many quizzes this meeting (0 or 1); default 1
#   reading   assigned reading, when a meeting carries one. Quizzes are
#             sporadic and drawn from the lecture, so this is not a gate.
#   books     "where to read more" — chapters of the three handbooks that
#             fit this meeting. Markdown, rendered under its own heading.
#   due       anything due on or around this meeting
#   links     extra sidebar entries belonging to this meeting, each with
#             `text` and `href`. They sit under the meeting, indented to
#             align with the meeting titles.
#   note      free text, used for recess rows
#   reschedule  set when instructor travel puts this date in question. Marks
#             the date with an asterisk everywhere and prints the footnote.

# Material that belongs to the whole course rather than one meeting.
# Emitted as its own sidebar section after the parts.
resources:
  - text: "Where to get data"
    href: fall-2026/data-sources.qmd
  - text: "Permissions and ethics"
    href: fall-2026/permissions.qmd
  - text: "Working in a team"
    href: fall-2026/teamwork.qmd
  - text: "Potential project ideas"
    href: fall-2026/project-ideas.qmd

term: "Fall 2026"
meets: "Wednesdays, 2:00–4:30 pm"
parts:
  - id: 1
    tab: "Getting started"
    title: "Getting started"
    blurb: >
      Who is in the room, how the course works, and then the part that
      actually matters — turning an interest into a question somebody
      could answer, and reading enough to know whether somebody already
      has.

  - id: 2
    tab: "Inference"
    title: "Evidence, models, and inference"
    blurb: >
      The conceptual core. What a causal claim is, what the standard models
      estimate, where uncertainty comes from, the difference between
      explaining and predicting, and how inference goes wrong — taught on
      examples from industry and the news, before anyone opens a dataset.
      Teams form in the first meeting of this part, and it closes by writing
      the problem up and presenting it.

  - id: 3
    tab: "Designs"
    title: "Research designs"
    blurb: >
      The ways applied economists get a credible estimate, from conditioning
      on observables to designs built on found variation — what variation
      each exploits, what each assumes, and how each fails.

  - id: 4
    tab: "Data & access"
    title: "Measurement, data, and getting hold of it"
    blurb: >
      The step most projects skip. Turning a construct into something a
      dataset can hold, working out what the design actually demands, and
      then the practical business of obtaining it — sources, proprietary
      access, data-use agreements, the IRB, and what scraping and APIs can
      and cannot get you.

  - id: 5
    tab: "Bringing it home"
    title: "Bringing it home"
    blurb: >
      The last stretch. Seeing what a figure shows and what it hides, the
      midterm, and then turning a semester of weekly pieces into one
      proposal somebody could pick up and execute. You finish with a plan,
      a pitch, and a team that knows how to work together.

# Individual writing pieces, assessed together as the writing portfolio.
# Two of them are reverse-outlining: going from a finished text back to the
# outline that must have produced it. You cannot build an outline until you
# can see one.
writing:
  - num: 1
    name: "Reverse outline"
    len: "1 page"
    due_meeting: 7
    desc: "Take an assigned published paper and reconstruct its outline: one topic sentence per paragraph, in order, in your own words. Then say in three lines what the argument actually is."
  - num: 2
    name: "Reverse outline and repair"
    len: "1 page"
    due_meeting: 9
    desc: "A badly organised passage. Give its real outline, then the outline it should have had, and say what moved and why."
  - num: 3
    name: "Plain-language summary"
    len: "1 page"
    due_meeting: 12
    desc: "Your project explained to a decision-maker who is not an economist. No jargon, no hedging, and the 'so what' in the first sentence."
  - num: 4
    name: "Referee report"
    len: "2 pages"
    due_meeting: 14
    desc: "A structured critique of another team's proposal outline, on the template used in class. You get theirs after meeting 13, and they get yours — so the critique arrives while there is still time to act on it."

# Team deliverables. One paper, reached in three milestones: a one-page pitch,
# then the whole argument as a detailed outline, then the written proposal.
# Nothing is submitted as a finished paper out of nowhere — the argument is
# fixed before the sentences are. The syllabus table is generated from this
# block, so the dates cannot drift from the meeting schedule.
deliverables:
  - num: 1
    name: "Project pitch"
    weight: "5 %"
    due_meeting: 6
    when: "in class"
    desc: "One page, and five minutes in front of the room. The question, why it matters, which archetype it is, and what data would answer it. This is the first time the project has to survive an audience, and the page is what you hand in."

  - num: 2
    name: "Proposal outline"
    weight: "10 %"
    due_meeting: 12
    desc: "The whole proposal as a detailed outline. One topic sentence per paragraph, in order, with the evidence noted underneath — the citation, the number, the figure you will point at. It has to cover the question, the identification strategy and the assumption carrying it, the unit and sample, the data and exactly how you get it, the threats to validity, and the work plan for the spring. Workshopped in rotation at meeting 13. If the argument does not work here, it will not work at 5,000 words."

  - num: 3
    name: "Research proposal"
    weight: "20 %"
    due_date: 2026-12-11
    desc: "~5 pages, written out from the outline you workshopped. The plan somebody could pick up and execute in January."

  - num: 4
    name: "Final presentation"
    weight: "5 %"
    due_meeting: 14
    when: "in class"
    desc: "Ten minutes. The question, the design, the data, and what your team does over the break."

meetings:
  - num: 1
    slug: "01-questions"
    date: 2026-08-26
    part: 1
    title: "Intro and ideas"
    desc: "Who is in the room, how the course works, and what a capstone actually is — the analysis somebody needs before a decision, not a journal paper. Then the part that matters: five shapes a good project takes, six ways they go wrong, and a filter of four questions that kills the rest."
    goal: "Turn a dataset you did not choose into a question worth asking. Break somebody else's question by naming the filter it fails. Know where to find data you already have."
    a: "Three blocks. First, introductions — who I am, and then every one of you: where you are from, what you did before this, your concentration, and what you want out of the program. Second, the course. The arc into AEM 6992, what this is and is not, where the grade goes, and the ground rules for AI — permitted, disclosed, verified, with fabricated citations the one that will bite you. Third, the part that is actually the job: coming up with the question. Five archetypes — evaluation, preference and pricing, prediction and risk, diagnosis, feasibility. For each, what it can claim, what design it needs, and how it fails. Then six anti-patterns, and a filter with four questions."
    b: "Where to look first: the Cornell library's holdings and the Dewey marketplace, browsed live. Then the question relay, in groups and against the clock. First your group gets a dataset and writes the best question it can. Then datasets and questions rotate in opposite directions, so you never get your own back. Next you break the question you inherit by naming the filter that kills it, then write your own on a dataset you have not seen. In the last round you may combine any two datasets you have held. Points for questions that survive, and for breaks that land."
    builds: "Candidate questions of your own, each labelled with an archetype and run through the filter"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 1 on what research is, and ch. 3 on the research cycle."
    quizzes: 0
    reading: "None"
    due: "One page on what you want to work on and why — before meeting 2"
    links:
      - text: "Question relay cards"
        href: fall-2026/handouts/relay-cards.qmd

  - num: 2
    slug: "02-causal-language"
    date: 2026-09-02
    part: 2
    title: "Causal language"
    desc: "Every comparison is a claim about a world that did not happen. Counterfactuals give you the language for that. Causal graphs give you the picture: confounders, colliders, mediators, back doors."
    goal: "Draw your project's causal graph. Say which variable you must condition on, and which you must not touch. Leave with your team's ground rules in writing."
    a: "Counterfactuals and potential outcomes. Every comparison is a claim about a world that did not happen. Then causal graphs: confounders, colliders, mediators, back-door reasoning. And why controlling for everything makes things worse. Finally the map for the rest of this half. Every design we meet closes a back door in a different way. You will draw each one before you hear what it is called."
    b: "First, teams. You are put into one, and it writes down its own ground rules today, while everybody still gets along. Who does what. What happens when somebody misses a deadline. How you settle a disagreement. One page, signed, handed in. Then your team's first job together. Each team draws a card carrying a real causal claim somebody is acting on — a board paper, a marketing deck, a widely shared post. Every card is broken differently. Draw the graph behind it, then name the failure in this morning's vocabulary. Then one team is drawn at random to defend its diagnosis while the room attacks, and we draw again as the clock allows. You will not know whether you are up. Card 3 is a collider and card 5 is a mediator. Those two are where the morning either landed or it did not."
    builds: "Your team's ground rules, and a diagnosed causal graph"
    books: "[Remix](https://mixtape.scunning.com/) ch. 3 on directed acyclic graphs and ch. 4 on potential outcomes — the two chapters closest to this meeting. [Mostly Harmless](https://www.mostlyharmlesseconometrics.com/) ch. 1, *Questions about Questions*, is eight pages and needs no maths."
    reading: "TBD"
    due: "Your team's written ground rules — agreed and handed in today"
    links:
      - text: "Causal claim cards"
        href: fall-2026/handouts/causal-claims.qmd

  - num: 3
    slug: "03-models-uncertainty"
    date: 2026-09-09
    part: 2
    title: "Models and uncertainty"
    desc: "What the standard models estimate, and how to read a coefficient in the units of the problem. Where uncertainty comes from, and what a p-value is not. Then the distinction that decides half your projects: explaining or predicting."
    goal: "Read a coefficient in the units of the problem. Say what a p-value does and does not tell you. Tell an explanatory question apart from a predictive one."
    a: "Linear regression, non-linear models, count models. Described, not derived. What each estimates, and how to read a coefficient in the units of the problem. Then uncertainty. Residuals and errors, sampling variation, what a standard error actually states, and where p-values come from. More usefully: what they are not. Finally the distinction that decides half the projects in this room. Explaining is not predicting. A model can predict well and still tell you nothing about what to do."
    b: "Ten minutes of simulation first, driven from the front. Draw from a world you control. Watch the p-value distribution under the null. Move the sample size and the variation, and watch it shift. Then fit the same world in and out of sample, and watch an excellent-looking model fail on data it has not seen. Nothing to install. Then the cards. Each team gets an analyst who ran something and said something about it, and every one overclaims differently. A count outcome fitted by OLS and predicted below zero. A 0.03% lift called highly significant across two million users. A wide interval called no effect. An elasticity estimated off two price changes in three years. A churn probability of 112%. Work out what they are actually entitled to claim. Then a team is drawn at random to defend that while the room pushes back. The last line on the sheet is the one that matters: is your own project at risk of the same error?"
    builds: "The overclaim your own project is most at risk of making"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 11 on descriptive statistics and ch. 12 on correlation and regression."
    reading: "TBD"
    due: ~
    links:
      - text: "Results critique cards"
        href: fall-2026/handouts/results-claims.qmd

  - num: 4
    slug: "04-inference-goes-wrong"
    date: 2026-09-16
    part: 2
    title: "How inference fails"
    desc: "Estimates go wrong in two ways. Bias moves the number: omitted variables, sorting, measurement error, reverse causality. False precision leaves the number alone and shrinks the error bar."
    goal: "Take a published claim apart. Name the specific failure. Say which direction it pushes the estimate, and whether more data would fix it."
    a: "Bias first. Omitted variables, sorting and selection, measurement error — classical and not — and reverse causality. For each: what it does to the estimate, and in which direction. Then false precision, which is the quieter problem. Dependence ignored. Multiple testing. Specification search. The number stays where it is and the error bar shrinks around it."
    b: "First, together: one published claim, taken apart. Which failure is doing the damage? Would more data fix it? Then the same move on a paper from your own literature. Write down the one threat your design will have to survive. You will be answering it in November."
    builds: "The one threat your design will have to survive"
    books: "[Remix](https://mixtape.scunning.com/) ch. 5 on unconfoundedness, for what conditioning can and cannot fix. [Adams](https://doi.org/10.4135/9788132108498) ch. 14 on reliability and validity."
    reading: "TBD"
    due: ~

  - num: 5
    slug: "05-selection-on-observables"
    date: 2026-09-23
    part: 2
    title: "Controls and matching"
    desc: "The workhorse of applied work: control for what you can measure. Controls, matching, and when a coefficient can be read causally. The assumption it rests on is also its ceiling."
    goal: "Draw the back doors a set of controls closes. State exactly what would have to be true for your coefficient to be read causally."
    a: "We start where every design meeting from here starts. At the graph. Conditioning on observables, drawn: which back doors a set of controls closes, and the one you cannot see well enough to close. Then controls and matching in practice, and when a regression coefficient can be read causally. 'I added controls' is a claim about the graph, not a technique. The rest of the session is what would have to be true for that claim to hold."
    b: "Back to the graph you drew in meeting 2. Could you close every back door with data you could actually obtain? Breakout rooms, then report back."
    builds: "Which back doors you can close, and with what data"
    books: "[Remix](https://mixtape.scunning.com/) ch. 5 on unconfoundedness — the whole of this meeting, written out."
    reading: "TBD"
    due: ~
    reschedule: "Instructor traveling — this meeting is held remotely"

  - num: 6
    slug: "06-writing-the-problem"
    date: 2026-09-30
    part: 2
    title: "Writing the problem"
    desc: "The conceptual half is done and the first paper is due. So this is where writing gets taught. What a problem statement does, how a pile of sources becomes an argument, and then each team presents its problem to the room."
    goal: "Reconstruct the outline behind somebody else's paper. Build your own the same way, topic sentence by topic sentence. Then defend your research problem in front of the room."
    a: "Academic writing I — the method. A paper is built outline first. One topic sentence per paragraph, in order, before any prose exists. We start backwards. Take a published paper apart into the outline that must have produced it. That is also this week's exercise, and the fastest way to see that good writing has a skeleton. Then forwards: outline, sketch, full text. Every written product in this course is submitted in those stages, so the argument is fixed before the sentences are. Then what a problem statement in particular has to do. Scope, unit, population. The 'so what' in the first sentence, not the fourth paragraph. And the failure modes: the topic with no question, hedging, the buried claim, the review that reviews without arguing."
    b: "Each team presents its research problem in five minutes. The presentation is this morning's method under test, because your five slides are an outline. One topic sentence per slide. No bullet lists. If the argument does not stand up as five sentences, it will not stand up at five pages, and the room will see which it is. Questions are aimed at the skeleton: where does the argument jump? Then you rate your teammates for the first time."
    builds: "Your problem statement, as an outline"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 4 on literature review and critical reading, and ch. 16 on writing up."
    reading: "TBD"
    due: "Project pitch — one page, presented in class · Rate your teammates"

  - num: 7
    slug: "07-designs-i"
    date: 2026-10-07
    part: 3
    title: "Research designs I"
    desc: "Experiments, instrumental variables, regression discontinuity. What variation each exploits, what each assumes, and how each fails."
    goal: "Draw the graph for an experiment, an instrument and a discontinuity. Say whether any of the three is open to your question."
    a: "Three designs, each drawn before it is described. Experiments first. Randomisation cuts every arrow into treatment, so there is no back door left to close. Then the decisions that actually make one work. What is the unit you randomise — the person, the store, the week? How many arms can you afford before each one is too thin? Why you check balance afterwards, and what a failure would mean. And pre-registration, the cheapest honesty device in research: say what you will test before you look, and specification search stops being available to you. Instrumental variables next. An arrow into treatment, and none into the outcome except through it. The exclusion restriction is that missing arrow, which is why it cannot be tested. Then regression discontinuity: nothing else jumps at the cutoff. For each, what variation it exploits, what it assumes, how it fails, and what it looks like done well."
    b: "Each team draws a setting nobody in the room owns. A bank with an email list. A scholarship cutoff. An NGO that gave filters to whoever asked. Fifteen minutes to draw the graph, name a design, and state the assumption carrying it. Then teams are drawn at random to defend for four minutes while the room attacks. What breaks this? Nobody knows in advance whether they are up. One card cannot be answered honestly at all, and the team holding it has to be willing to say so. Last: is an experiment, an instrument or a discontinuity actually open to your own project? Most teams find the answer is no. Finding that out today rather than in November is the point."
    builds: "Whether an experiment, instrument or discontinuity is open to you"
    books: "[Remix](https://mixtape.scunning.com/) ch. 4 on randomization, ch. 6 on regression discontinuity, ch. 7 on instrumental variables. In [Mostly Harmless](https://www.mostlyharmlesseconometrics.com/), the same three are ch. 2, 6 and 4."
    reading: "TBD"
    due: "Writing 1 — reverse outline"
    links:
      - text: "Design scenarios"
        href: fall-2026/handouts/design-scenarios.qmd

  - num: 8
    slug: "08-designs-ii"
    date: 2026-10-14
    part: 3
    title: "Research designs II"
    desc: "Difference-in-differences, panel data with fixed effects, event studies. The question is the same each time: which identifying variation survives the fixed effects, and what assumption is left carrying the estimate."
    goal: "Draw your project's design as a graph. Name the single assumption carrying the estimate — the one you would have to defend to a sceptic."
    a: "The same discipline on harder designs, each drawn first. Difference-in-differences: the confounders you cannot measure are the ones that do not move. Parallel trends is what that assumption looks like drawn. Panel data with local fixed effects: which arrows the fixed effects erase, and which survive untouched. Event studies: the same picture with time on it. For each, what identifying variation is left once the fixed effects are in, and what assumption is carrying the estimate."
    b: "Same format, higher stakes. First a card apiece — a staggered rollout, a state border, a fee that changed for accounts opened after a date. Fifteen minutes to draw it and name the design. Then the part that counts. Teams are drawn at random to put up their own project's design, draw the graph, state the assumption carrying the estimate, and defend it while the room tries to break it. Everyone presents eventually. Nobody knows when. Whatever survives is the figure that goes in your identification section, so draw it to keep. And write down the attack that landed. That is your limitations paragraph."
    builds: "Your design defended in public, plus the attack that landed — the identification section and the limitation"
    books: "[Remix](https://mixtape.scunning.com/) ch. 8 and 9 on panel designs and difference-in-differences, ch. 10 if your rollout is staggered. [Mostly Harmless](https://www.mostlyharmlesseconometrics.com/) ch. 5."
    reading: "TBD"

  - num: 9
    slug: "09-measurement"
    date: 2026-10-21
    part: 4
    title: "Measurement and data"
    desc: "Turning a construct into something a dataset can hold. This is where most capstones actually die. Then working backwards from the design to the data it demands, and building the instrument yourself when nothing measures what you need."
    goal: "Turn your central construct into a variable somebody could record. Specify what the design demands of the data. If nothing measures it, write the instrument that would — and say how many observations it needs to be worth fielding."
    a: "Constructs and operationalisation. How do you turn 'sustainability', 'financial literacy' or 'market power' into a variable somebody could actually record? What makes that measure defensible, and what does a proxy cost you? Then work backwards from the design to its data requirements. Unit of observation. Level of aggregation. Time frequency, span, coverage. Which comparisons the data has to contain. Can this be done with county data, or does it need individuals? Finally, the short version of what to ask any dataset before trusting it: what is one row, how many are there, what is missing, what changed over time. The full checklist is on the resources page. You put it to work on real data in meeting 11."
    b: "Sometimes nothing measures your construct. Then you make the measurement yourself. Each team gets a real survey item, broken a different way. Leading. Double-barrelled. An unbalanced scale with no way to disagree. A question that assumes you already do the thing. A hypothetical willingness-to-pay that everybody overstates. Name the flaw, rewrite it, and say what an answer to your version would actually let you conclude. Random rotation, room attacks. Then build your own — the instrument your project needs, whether that is survey items, a choice task, or a simple experiment with a treatment and a control. Then work out how many people it needs. The smallest effect you can detect is roughly four sigma over root n. Quadrupling the sample only halves it. So: with the sample you can afford, is the smallest detectable effect still interesting? If not, you have learned that in October rather than March."
    builds: "Your key variable, operationalised — and if you must collect it, the instrument and the sample size it needs"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 5 on sampling and sample size, ch. 8 on survey design, ch. 14 on whether a measure holds up."
    reading: "TBD"
    due: "Writing 2 — reverse outline and repair"
    reschedule: "Instructor traveling — moves to Oct 20 or Oct 22; date to be confirmed"
    links:
      - text: "Instrument critique cards"
        href: fall-2026/handouts/instrument-cards.qmd

  - num: 10
    slug: "10-getting-data"
    date: 2026-10-28
    part: 4
    title: "Getting the data"
    desc: "What code is and why you cannot avoid understanding it. Then the practical business of obtaining data: who holds it, what access really costs in time, and what scraping and APIs can and cannot get you."
    goal: "Say what a scraper and an API each are, and when either is the wrong answer. Name your own data source, its access route, its timeline and your plan B — including whether you need IRB approval or a data-use agreement before January."
    a: "First, code. Not how to write it — what it is, and why you cannot avoid understanding it. What a language actually is, and why there are several. R grew out of statistics. Python out of general programming. Stata out of applied economics. SQL is not really the same kind of thing at all. Then the argument that matters here. Every serious analysis is code, whether or not you wrote it. A spreadsheet stops being enough at exactly the point your project gets interesting. And code is the only version of an analysis that can be checked, repeated, and handed to somebody else. You will drive it through an assistant. But you cannot check what you cannot read at all. Then the landscape of sources: administrative records, official statistics, firm and platform data, purchased panels. What each costs in money and in months, starting with what Cornell already pays for. Proprietary access and data-use agreements: who signs, how long, and what they forbid you from publishing. Ethics and the IRB in brief, with the detail on the resources page. Then scraping and APIs: what each is, what it can and cannot get you, and what the terms of service and the law actually say."
    b: "A scrape, run live from the front, then broken on purpose. We pull a table off a page. Then we watch every way it fails. The page changes and the code returns nothing. The rate limit bites. Records go missing and nothing tells you. The terms of service say no. And nothing you pulled could be reproduced by anybody next week. Then the same data through a proper API. Then the same data simply downloaded, which is usually faster than either. The lesson is not that scraping is bad. It is the last resort dressed up as the clever one. Then the acquisition clinic on your own project. Which source, exactly. What route. How long. What it costs. What plan B is. Your memo outline — six topic sentences — comes out of that, and it is due before the weekend."
    builds: "Your data source, access route, timeline and plan B"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 7 on secondary data, ch. 6 on collecting your own, and ch. 2 on research ethics."
    reading: "TBD"

  - num: 11
    slug: "11-using-data"
    date: 2026-11-04
    part: 4
    title: "Using data"
    desc: "'Use AI' is four different things, and they fail differently. Then real data in front of you, and the checks that catch a wrong answer without your ever reading the code."
    goal: "Say which AI modality suits which job, and why. Interrogate a real dataset through one, and catch something wrong with it before it reaches your proposal."
    a: "First, the modalities. 'Use AI' is four different things. Chat answers from memory, and will invent a citation. File upload with code execution writes and runs real code on your data, so the output is checkable. Retrieval answers from documents you supplied. Agents act over several steps, and compound a mistake made early. The one you want here is the second, and knowing why is the point. Then the harder half, which is the whole skill in this course: knowing whether an answer is right without reading the code that produced it. Row counts across a join. Totals checked against a published figure. Five raw records read by hand. Orders of magnitude. And what you must not upload, and why."
    b: "Real data in front of you, and the meeting-9 checklist put to work: what is one row, how many are there, what is missing, what changed over time. Every dataset handed out has something wrong with it. Find it, then say which check would have caught it — that second half is the graded one. Then the same move on your own project's data. Whatever you cannot answer about it today is what you chase before the outline is due."
    builds: "Your own data, interrogated, and what is wrong with it"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 11 on descriptive analysis — what to compute first, and what it tells you."
