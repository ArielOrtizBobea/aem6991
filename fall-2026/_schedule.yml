# AEM 6991 · Fall 2026 — single source of truth for the meeting schedule.
#
# The front-door table, the syllabus table, the _quarto.yml sidebar, and the
# session pages are all generated from this file by _tools/build_site.R.
# Edit here and re-run; never edit the generated artifacts by hand.
#
# To start a new year: copy this file into the new offering's folder, shift
# the dates, and edit forward. The diff is the year-over-year change log.
#
# Fields
#   num       meeting number; omit for a non-meeting row (recess)
#             (the key is `num`, not `n` — YAML 1.1 reads a bare `n` as false)
#   date      ISO date of the meeting
#   part      part of the course this meeting belongs to
#   title     full title, used as the session page heading
#   short     compressed title for the sidebar (falls back to title)
#   slug      session page filename, fall-2026/sessions/<slug>.qmd
#   desc      one-to-two sentence description for the front-door table
#   goal      what a student can DO after this meeting. One sentence,
#             written as a capability, not a topic list.
#   a         session A (2:05–3:15) — concept, with worked examples
#   b         session B (3:35–4:30). THE RULE, in two halves:
#             (1) TEST what session A taught, on a shared case — everyone
#                 works the same object, so teams can be compared and
#                 corrected, and a deliberately bad example can be used.
#             (2) APPLY it to your own project — which is what makes the
#                 project advance a piece a week instead of being written
#                 in November.
#             Half (2) is the artifact submitted before you leave, and
#             `builds:` records what it contributes. Logistics — team
#             formation, peer evaluation, presentations — ride along
#             inside B; they never replace it. Deliberate exceptions:
#             meeting 13 (A is the midterm) and meeting 14 (the pitch).
#             Every session B opens with a ten-minute team check-in.
#
#             THE DEFENCE, used in meetings 2, 3, 6 and 7: every team
#             works its own card at the same time, then ONE team is drawn
#             AT RANDOM to defend at the front while the rest of the room
#             attacks. Draw again, and again, as far as the clock allows.
#             Random is the whole point — nobody knows whether they are
#             up, so every team has to be ready, and being ready is the
#             thing being taught. Points for attacks that land, as in the
#             meeting-1 relay.
#   builds    what this meeting's session B contributes to the team's
#             final design paper. Generates the "how your paper gets
#             built" table in the syllabus.
#   quizzes   how many quizzes this meeting (0 or 1); default 1
#   reading   assigned reading, when a meeting carries one. Quizzes are
#             sporadic and drawn from the lecture, so this is not a gate.
#   books     "where to read more" — chapters of the three handbooks that
#             fit this meeting. Markdown, rendered under its own heading.
#   due       anything due on or around this meeting
#   links     extra sidebar entries belonging to this meeting, each with
#             `text` and `href`. They sit under the meeting, indented to
#             align with the meeting titles.
#   note      free text, used for recess rows
#   reschedule  set when instructor travel puts this date in question. Marks
#             the date with an asterisk everywhere and prints the footnote.

# Material that belongs to the whole course rather than one meeting.
# Emitted as its own sidebar section after the parts.
resources:
  - text: "Where to get data"
    href: fall-2026/data-sources.qmd
  - text: "Permissions and ethics"
    href: fall-2026/permissions.qmd
  - text: "Working in a team"
    href: fall-2026/teamwork.qmd
  - text: "Potential project ideas"
    href: fall-2026/project-ideas.qmd

term: "Fall 2026"
meets: "Wednesdays, 2:00–4:30 pm"
parts:
  - id: 1
    tab: "Getting started"
    title: "Getting started"
    blurb: >
      Who is in the room, how the course works, and what you are here to
      build. You leave the first meeting knowing what everyone else is
      interested in, which is how the teams get formed.

  - id: 2
    tab: "Foundations"
    title: "Foundations"
    blurb: >
      What a causal claim is, where good questions come from, what you are
      allowed to do with other people's data, and the tools you will work
      through. Teams form here. So does the question.

  - id: 3
    tab: "Methods & designs"
    title: "Research methods and designs"
    blurb: >
      What the standard models estimate and where uncertainty comes from.
      Then how estimates go wrong and what fixes them. Then the designs
      applied economists use to get a credible answer — what variation each
      exploits, what each assumes, and how each fails.

  - id: 4
    tab: "Communication"
    title: "Communicating the work"
    blurb: >
      Half of what you are graded on is whether somebody else can follow
      the argument. So it is taught, not assumed. One meeting on writing,
      one on figures, one on standing up and saying it. In all three,
      session B works on your own project.

  - id: 5
    tab: "Delivery"
    title: "Delivery"
    blurb: >
      The midterm, and then the pitch. A semester of weekly pieces becomes
      one proposal somebody could pick up and execute in January.

# Individual writing pieces, assessed together as the writing portfolio.
# Two of them are reverse-outlining: going from a finished text back to the
# outline that must have produced it. You cannot build an outline until you
# can see one.
writing:
  - num: 1
    name: "Reverse outline"
    len: "1 page"
    due_meeting: 9
    desc: "Take an assigned published paper and reconstruct its outline: one topic sentence per paragraph, in order, in your own words. Then say in three lines what the argument actually is."
  - num: 2
    name: "Reverse outline and repair"
    len: "1 page"
    due_meeting: 10
    desc: "A badly organised passage. Give its real outline, then the outline it should have had, and say what moved and why."
  - num: 3
    name: "Plain-language summary"
    len: "1 page"
    due_meeting: 12
    desc: "Your project explained to a decision-maker who is not an economist. No jargon, no hedging, and the 'so what' in the first sentence."
  - num: 4
    name: "Referee report"
    len: "2 pages"
    due_meeting: 14
    desc: "A structured critique of another team's proposal outline, on the template used in class. Outlines are exchanged between partner teams at meeting 12, so the critique arrives while there is still time to act on it."

# Team deliverables. One paper, reached in three milestones: a one-page pitch,
# then the whole argument as a detailed outline, then the written proposal.
# Nothing is submitted as a finished paper out of nowhere — the argument is
# fixed before the sentences are. The syllabus table is generated from this
# block, so the dates cannot drift from the meeting schedule.
deliverables:
  - num: 1
    name: "Project pitch"
    weight: "5 %"
    due_meeting: 9
    when: "in class"
    desc: "One page, and five minutes in front of the room. The question, why it matters, which archetype it is, and what data would answer it. This is the first time the project has to survive an audience, and the page is what you hand in."

  - num: 2
    name: "Proposal outline"
    weight: "10 %"
    due_meeting: 12
    desc: "The whole proposal as a detailed outline. One topic sentence per paragraph, in order, with the evidence noted underneath — the citation, the number, the figure you will point at. It has to cover the question, the identification strategy and the assumption carrying it, the unit and sample, the data and exactly how you get it, the threats to validity, and the work plan for the spring. Exchanged with a partner team at meeting 12, who referee it. If the argument does not work here, it will not work at 5,000 words."

  - num: 3
    name: "Research proposal"
    weight: "20 %"
    due_date: 2026-12-11
    desc: "~5 pages, written out from the outline you workshopped. The plan somebody could pick up and execute in January."

  - num: 4
    name: "Final presentation"
    weight: "5 %"
    due_meeting: 14
    when: "in class"
    desc: "Ten minutes. The question, the design, the data, and what your team does over the break."

meetings:
  - num: 1
    slug: "01-introductions"
    date: 2026-08-26
    part: 1
    title: "Introductions"
    desc: "Who is in the room, and how the course runs. AEM 6991 produces a plan and AEM 6992 executes it, so everything you commit to this fall you live with in the spring. Then an afternoon of structured conversation, because I form the teams out of what you tell each other you are interested in."
    goal: "Say what you are interested in, in one line a stranger can repeat back. Turn a dataset you did not choose into a question worth asking, and break somebody else's by naming the filter it fails."
    a: "Three blocks. First, me. Where I came from, what I work on, and one result of my own — including the thing that nearly sank it. Then you. Four items each: your name and where you are from, what you studied or did before this, your concentration, and what you want out of this program and after it. Twenty-five people at forty seconds each takes most of the block. It is worth it. This is how the room learns who it is, and you will hear an interest you did not expect to share. You use that this afternoon. Second, the course. AEM 6991 produces a plan. AEM 6992 executes it. The deliverable in December is a proposal somebody could pick up in January. You are not writing a journal paper. There is no gap to fill and no contribution to claim. You are building the analysis a competent team would need before a decision that costs real money, and the standard for competent is a referee's. The genre moves; the rigor bar does not. Where this class actually goes: 40% into finance, 21% into marketing and sales, 15% into general management, 13% into consulting. Almost none into research. Third, the rules. Everything lives on the course site, one page per meeting, permanently. Canvas carries grades and submissions and nothing else. So a missed meeting is recoverable. AI is permitted, disclosed, and verified. The one that will bite you is the fabricated citation, so we take a topic from the room, ask an assistant for five references with DOIs, and open every one of them on the screen. Quizzes are short, unannounced, and drawn from the lecture you are sitting in. Roughly six, three questions, three minutes, lowest dropped. Attendance is the session-B check-in, and it cannot be filed retrospectively. Then the dates. Statement of interest September 2. Pitch October 21. Proposal outline November 11. Midterm in class November 18. Final presentations December 2. Proposal December 11. Then the grade. Half of it is yours alone, half is your team's, and the team half is graded individually wherever it can be."
    b: "Your interests, not somebody else's datasets. Teams do not exist yet, and I form them from what you tell each other this afternoon. So you write a card: what you are interested in, in one sentence; one thing you bring that most people in this room do not; and one person or organisation who would do something differently if they knew the answer. Then three rounds with a new partner each time. Your partner says your interest back to you in one sentence and you either accept it or fix it. Then they name who would act on it. Then they name what you have that the room does not, and one person here you should go and talk to. They sign every line they write. Then every card goes on the wall and you put your initials on any question you would be glad to work on. Last, five minutes on where to look for data: the Cornell library's licensed holdings, and Dewey, which the Johnson College subscribes to and which costs you nothing. Register tonight, because approval takes days."
    builds: "Your interest card — the one-line interest, what you bring, and who would act on the answer"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 1 on what research is."
    reading: "TBD"
    due: "One page on what you want to work on and why — before meeting 2"

  - num: 2
    slug: "02-causality"
    date: 2026-09-02
    part: 2
    title: "Theory and causality"
    desc: "A theory is a set of assumptions that produces a prediction you could be wrong about. Empirical work can settle part of that and never all of it. Then causality proper: every comparison stands in for a world that did not happen, and the graph tells you which variables to condition on and which to leave alone."
    goal: "Draw the causal graph behind a claim somebody is acting on, name the failure in it, and say which variable you must condition on and which you must not touch. Leave with your team formed and its ground rules in writing."
    a: "Three blocks. First, theory. A theory is a set of assumptions that produces a prediction you could be wrong about. That is all it is, and it buys you four things. It tells you which comparison to make. It tells you what sign to expect. It tells you what to hold fixed. And it tells you what result would embarrass you. It is also the only thing that lets a number travel. A 40% lift measured in New York says nothing about Chicago unless you know the mechanism that produced it. Two worked examples, both from markets you will work in. [Akerlof's market for lemons](https://doi.org/10.2307/1879431) predicts that good used cars stay off the market, and it points straight at the fixes — warranties, certification, return policies. Then a dispute. [Spence's signalling model](https://doi.org/10.2307/1882010) and human capital both predict that a degree raises wages. They disagree about why. That disagreement tells you which comparison settles it: the jump at graduation, not the slope across years of study. Second, what empirical work can and cannot settle. It can measure a magnitude. It can rule out a sign. It can decide between two theories that predict different things about the same comparison. It cannot test a theory on its own. Every test is a joint test of the theory, the measure, the sample and the model, so a rejection never tells you which of the four broke. And no amount of data tells you what to want. Third, causality, which is the rest of the term. Counterfactuals first. Every unit has two outcomes: the one with the treatment and the one without. You only ever see one of them. That is [Holland's](https://doi.org/10.2307/2289064) fundamental problem, and it is a missing-data problem rather than a statistics problem. So every comparison you make is a stand-in for a world that did not happen, and the only question is whether the stand-in is any good. Customers on the loyalty app spend 40% more. The counterfactual is what those same customers would have spent without the app. It is not what the other customers spent. Then the picture. Causal graphs are arrows between variables, and they let you argue about identification before you own any data. A confounder causes both the treatment and the outcome, opens a back door, and has to be closed. A collider is caused by both, and conditioning on it manufactures an association that was never there. A mediator sits on the path you are trying to measure, and conditioning on it deletes the effect you came for. Close the back doors. Leave the front door alone. That is also why controlling for everything makes things worse. Every extra control is a claim about the graph, not a safety measure, and a kitchen-sink regression is a graph nobody drew. Finish with the map. Every design in this course closes a back door in a different way. You will draw each one before you hear its name."
    b: "No check-in this week, because there are no teams yet. Making them is the first ten minutes. I read out the teams, formed from your statements of interest, and each one writes its own ground rules while everybody still gets along. Who does what. What happens when somebody misses a deadline. How you settle a disagreement, and who breaks a tie. One page, signed by everyone. Then the shared case, worked by every team at once. Eight cards, each carrying a real causal claim somebody is acting on — a board paper, a consulting deck, an HR review closing a matter, a widely shared post. Every card is broken in a different way. Draw the graph behind the claim. Name the failure in this morning's vocabulary. Then say what you would condition on, and what you must leave alone. Card 3 is the hiring puzzle, and it is a collider: among the people you hired, a strong test score and a strong interview trade off, because either one was enough to get in. Card 5 is the promotion gap, and salary band is a mediator: control for it and you have controlled away the thing you were looking for. Those two are where the morning either landed or it did not. Then one team is drawn at random to defend at the front while the room attacks, and we draw again as the clock allows. You will not know whether you are up. Points for an attack that lands, and you have to name what is wrong rather than say you dislike it. The last fifteen minutes are your own project. Your team has a shared interest and not yet a question, so take the closest thing you have and draw it: the treatment, the outcome, the one back door you would have to close, and the one variable you must not touch. That sheet is the artifact. It goes in with the ground rules before you leave. It is disposable and it will be wrong, which is the point of drawing it in September. You redraw it when we reach research designs, and the version that survives the room is the figure in your identification section."
    builds: "Your team's ground rules, and the first causal graph of your own question — treatment, outcome, the back door you must close, and the variable you must not touch"
    books: "[Remix](https://mixtape.scunning.com/) ch. 3 on directed acyclic graphs and ch. 4 on potential outcomes. [Mostly Harmless](https://www.mostlyharmlesseconometrics.com/) ch. 1, *Questions about Questions*, is eight pages and needs no maths."
    reading: "TBD"
    due: "Your team's written ground rules — agreed and handed in today"
    links:
      - text: "Causal claim cards"
        href: fall-2026/handouts/causal-claims.qmd

  - num: 3
    slug: "03-questions"
    date: 2026-09-09
    part: 2
    title: "Finding the question"
    desc: "Finding the question is the job, not the preamble to it. Five shapes a good project takes, six ways they go wrong, and a filter of four questions that kills most of the rest. Then the relay, where you break somebody else's question and they break yours."
    goal: "Turn an interest, or a dataset you did not choose, into a question somebody could answer, and say which archetype it is. Break a question that is not one by naming the filter it fails."
    a: "Three blocks. First, where ideas come from. Five routes: a gap in what is known, extending or contesting a published result, an anomaly, a decision somebody actually has to make, and a dataset nobody has looked at properly. Route five is the most dangerous, and we come back to why. Then the framing that matters. Most of your education has rewarded execution. This course rewards the part before it. A bad question executed beautifully is still a bad project. It is also the most enjoyable thing you will do all semester, so do not rush it. Second, whether there is a method for having ideas. Partly. Two of the popular answers have real evidence behind them, and most do not. Start from your means, not your goal. That is [effectuation](https://doi.org/10.5465/amr.2001.4378020), from Sarasvathy's think-aloud studies of expert entrepreneurs. Experts do not pick a goal and hunt for the means. They start from who they are, what they know and whom they know, and work forward. The second is simpler. Generate, then judge, and never both at once. Teams that evaluate while brainstorming produce fewer ideas, and safer ones. For research questions specifically, [Sandberg and Alvesson](https://doi.org/10.1177/1350508410372151) separate gap-spotting from problematization. For one semester, gap-spotting is usually right. Knowing which one you are doing is what stops you overclaiming. A caution that applies here as everywhere in this course: being taught in every business school is not evidence that something works. Design thinking as a branded five-step method is widely taught and lightly tested. So is lean startup. Third, the shapes a project can take. Five archetypes: evaluation, preference and pricing, prediction and risk, diagnosis and benchmarking, feasibility and landscape. For each, what it can claim, what design it needs, and how it fails. Evaluation asks whether it worked, and dies without a credible comparison group. Did the loyalty relaunch change basket size? Preference and pricing asks what people would choose and pay, and dies when stated preference gets reported as revealed preference. Prediction and risk asks what happens next, and dies when the team quietly starts making causal recommendations off a predictive model. Diagnosis asks where the gap is, and dies as description dressed up as a cause. Feasibility asks whether the opportunity is real, and dies as a deck of secondary research. A project that cannot pick one of the five is not yet a project. Then the last two cohorts, on one slide. Four of the five 2026 projects were the same project. Take a public signal anybody can download, regress a financial outcome on it, report a coefficient. Free data, no design, no decision attached. I let the room find that rather than saying it, because it lands harder from a student than from me. Then six anti-patterns. The topic with no question. The dataset in search of a question. The consulting deck. The unobtainable-data project. The dissertation. The already-answered question. And finally the filter, which is four questions. Could a team of three to five execute this in one spring semester? Can you name the specific dataset, who holds it, and how you get it, checked rather than assumed? Could the answer come out either way? Would anybody act differently depending on it? A no on any one is fatal, and it is cheap to discover today."
    b: "Ten-minute team check-in first. Then the question relay, against the clock. Nine dataset cards go out and your team holds one it did not choose. Real estate transactions. Climate risk by ZIP. Weekly foot traffic. EV chargers. Job postings with salaries. WARN layoff notices. Convenience store scanner data. Card spend by brand. CDC PLACES. Write the three best questions that data could answer, pick your best, put it at the top of the sheet, and label its archetype. Then the datasets pass one way and the question sheets pass the other, so no team ever gets its own question back. You break the question you inherit by naming which of the four filters kills it, or you write SURVIVES, honestly. Then you write a new question on a dataset you have not seen. In the last round you may combine any two datasets your team has held. I say the join keys out loud before that round starts. Parcels, stores and chargers carry lat/long. Postings and layoffs carry company. Scanner and card data carry brand. The good questions live in the joins. Scoring: one point every time a question of yours survives a break, one point for every break you land, two points for the best combination question. Saying a question is weak is not a break. You have to name the filter. Everybody works the same nine cards, so the kills are comparable, and I read out the two best combination questions and one good kill at the end. The kill goes last, because the killing is the lesson. Then your own project, which is the half you hand in. Three candidate questions for what your team actually wants to work on. Each labelled with an archetype. Each run through the four filters in writing, not in your heads. One of the three has to be crossed out with the filter that killed it named, because a team that kills nothing has not used the filter. That page is your question slate. It is submitted before you leave, it is what your pitch gets built from, and a question you kill in September is a month you do not lose in March."
    builds: "Your team's question slate — three candidate questions, each labelled with an archetype and run through the four filters, with one killed on the record"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 3 on the research cycle and ch. 4 on literature review and critical reading."
    reading: "TBD"

  - num: 4
    slug: "04-ethics"
    date: 2026-09-16
    part: 2
    title: "Ethics and access"
    desc: "Two gates stand between your design and your data, and they are different kinds of thing. The IRB is an ethics review. A data-use agreement is a contract. Both take longer than teams expect, which is why this meeting sits in September rather than in November."
    goal: "Say whether your project needs IRB review, a data-use agreement, both or neither — and defend the answer. Name the date each gate has to start, counted backwards from January, so the spring is not spent waiting."
    a: "Five blocks, and the last one is the point. First, why the rules exist — briefly, and without the sermon. Every rule in research ethics was written after a specific failure. Nuremberg followed the doctors' trial. The Belmont Report followed Tuskegee, which ran for forty years and was stopped by a reporter rather than by a scientist. Its three principles — respect for persons, beneficence, justice — are still the frame every IRB applies. But the modern failures are the ones that concern this room, and none of them involved a needle. Facebook ran a mood experiment on 689,000 users and published it. Cambridge Analytica harvested a personality quiz's friend graph. Second, the IRB. Two questions decide whether it applies. Is this research? Are there human participants? Teams miss the second half, because identifiable private information counts even when you never meet anybody. Scraped posts count when individuals are identifiable. So do purchased consumer records. Then the three levels of review, described in weeks rather than in definitions. Exempt can clear in a fortnight if nothing is wrong with the submission. Expedited runs to a month or more. The full board meets on a schedule you do not control, so its clock is a calendar, not a queue. And the rule that catches somebody every year: you do not decide that you are exempt. The IRB issues that determination, and it issues nothing until every person named on the protocol has finished CITI human-participants training. Exempt protocols included. One teammate who skipped the modules holds up the whole team, so do them this week, before you know whether you need them. Third, the other gate. A data-use agreement is a contract, not an ethics review, and the university signs it rather than you. Expect legal review on both sides. Expect months. Expect restrictions on what you are allowed to publish, which can mean you cannot show your own result. Terms of service are the same species — a contract you accepted by clicking. Scraping is rarely a crime and frequently a breach. Prefer the download, then the API, then nothing. Fourth, whether you may hold the file at all. Direct identifiers are the easy part. Latanya Sweeney showed that ZIP code, birth date and sex together identify most Americans uniquely. So \"we removed the names\" is not de-identification, and a vendor's word for it is not a determination. Then conflicts of interest, which are disclosed rather than confessed — a disclosure tells the reader how to weight your claim, nothing more. The clause to settle before anyone signs anything: a sponsor may have the right to review, never the right to veto. Then credit inside the team, agreed now, while there is still nothing to fight over. Fifth, integrity. Fabrication, falsification and plagiarism, one line each, with a case attached to each. Diederik Stapel invented his data and lost 58 papers. Reinhart and Rogoff made a spreadsheet error nobody checked and it moved fiscal policy in several countries. And the one that is live in this room: a fabricated citation is a fabrication. A New York lawyer was sanctioned $5,000 in 2023 for filing six cases an assistant had invented. \"The AI generated it\" was his defence, and it did not work for him either. Finally the calendar, run backwards from January. That is the argument for holding this meeting in September."
    b: "Ten minutes of team check-in, then the cards. Each team draws a project somebody actually proposed, and every one is blocked in a different place. A team scraping Glassdoor reviews with the usernames attached. A teammate's employer offering internal HR records, with a clause letting the firm approve the write-up. Interviews with farmers in the Dominican Republic, conducted in Spanish, by a team that has not done CITI. A vendor file sold as de-identified that carries ZIP, birth year and sex. A licensed WRDS extract about to be uploaded to a chatbot for cleaning. A survey of your own classmates about salary expectations and visa status. Three specifications run and only the one that worked reported. For each card, three answers. Which gate does this trip — IRB, DUA, terms of service, conflict of interest, integrity, or none? What is the earliest date it has to start? And the half that carries the marks: what is the version of this project that is legal, is honest, and is still worth doing? Then one team is drawn at random to defend at the front while the room attacks, and we draw again as the clock allows. Nobody knows in advance whether they are up. Two cards trip nothing at all, and the team holding one has to be willing to say so. Then your own project. You fill in the ethics-and-access checklist for it, on the template, and you hand it in signed before you leave. Human participants, yes or no, with the sentence that justifies the answer. Every data source you named, who holds it, and what its licence or terms permit. Whether any field is identifiable, what you do about it, and where the file will live. Any conflict, one sentence each. Who does what, by name. And the date the slowest gate has to start. Most teams will find they need none of it. The teams that do need something find out today, which is the whole reason this meeting is in September."
    builds: "Your project's ethics-and-access checklist — every gate it trips, who signs, and the date each one has to start"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 2 on research ethics."
    reading: "TBD"

  - num: 5
    slug: "05-tools-and-ai"
    date: 2026-09-23
    part: 2
    title: "Coding tools and AI"
    desc: "Every serious analysis is code, whether or not you wrote it. \"Use AI\" is four different things and they fail differently — only one of them produces output you can check. Then the practical business of getting a file at all: what Cornell already pays for, what an API is, and why scraping is the last resort dressed up as the clever one."
    goal: "Choose the right AI modality for a data job, and say why. Interrogate a file you did not create — through an assistant, without reading the code — and catch what is wrong with it before it reaches your proposal."
    a: "Four blocks. First, code. Not how to write it — what it is, and why you cannot avoid understanding it. Why there are several languages: R grew out of statistics, Python out of general programming, Stata out of applied economics. SQL is not the same kind of thing at all. It is a way of asking questions of data you never load onto your own machine. Then the argument that matters here. Every serious analysis is code, whether or not you wrote it. A spreadsheet stops being enough at a moment you can name: when you join two files, when the same cleaning has to run again on next month's extract, or when somebody asks what changed between version 4 and version 7. Two cases make that better than any principle. Reinhart and Rogoff's growth result averaged fifteen countries where the formula should have covered twenty, and it had already been quoted in austerity debates before anyone opened the sheet. Public Health England lost 15,841 COVID cases in 2020 because an old Excel format stops at 65,536 rows and says nothing at all when it runs out. Neither is a statistics error. Both were invisible in a spreadsheet and would have been visible in code. You will drive code through an assistant. But you cannot check what you cannot read at all. Second, the four things people mean by \"use AI\". They fail differently, and that is the whole point. Chat answers from memory. It invents citations that look real — right journal, plausible authors, a DOI that resolves to something else. File upload with code execution is different in kind: the assistant writes real code, runs it on the file you gave it, and shows you both. That is the only modality where the output is checkable, and it is the one this course uses. Retrieval answers from documents you supplied, which bounds the invention without removing it. Agents act over many steps without stopping to ask. Pick the wrong column at step two and by step nine it is buried under eight correct-looking operations. So you choose the modality by whether you will be able to tell it was wrong. Third, the skill this course actually grades: judging an answer without reading the code that produced it. Five checks, and they take four minutes. Row counts across a join — a join that grew has a duplicate key, and a join that shrank quietly dropped the rows that did not match, which is how a result ends up being about a different population than you think. Totals against a published figure. Five raw records read by hand, with your eyes, before any summary. Orders of magnitude: 58 and 58,000 are different claims about household income, and the gap is usually a units column nobody mentioned. And the one nobody runs — ask for the same number a second way and see whether it comes back the same. Then what you must not upload. Restricted, IRB-covered and DUA-covered data do not go into a public chatbot. That is meeting 4, and this is the week it stops being abstract. Fourth, getting hold of data at all. Start with what Cornell has already paid for — Dewey, WRDS, Capital IQ, IBISWorld — and the free public sources that need no login: FRED, IPUMS, EDGAR, data.census.gov. Then the three routes to a file. Downloading is boring and usually fastest. An API is a documented door: a key, a rate limit, stable field names, and a record of what you asked for. Scraping is the last resort dressed up as the clever one, and I will break one in front of you. The page changes and the code returns nothing. The rate limit bites. Records go missing without a single error message. The terms of service say no. And nothing you pulled could be reproduced by anybody next week. Going to a county assessor yourself is worth it only when you need one county in unusual depth, or a field the national vendor does not carry. Last, reproducibility, at the level of awareness rather than tooling. Keep the raw file untouched. Keep one path from raw to result. Keep a note saying where the raw came from and on what date. The test is simple: could a teammate get your number on a different laptop next week? If not, you do not have a result. You have a screenshot."
    b: "Ten-minute check-in first. Then everybody works the same file. `store-weeks.csv` is a retail extract with four things planted in it. A block of store-weeks is duplicated, so every total is too big. Twelve prices are recorded in cents while the rest are in dollars. Missing values are coded −99, which a mean will swallow without complaint. And one store stops reporting in July, so a year-on-year comparison silently compares nine months against twelve. You find them by driving an assistant with file upload. You do not find them by reading the file. Twenty minutes. Then the half that is actually graded, which is the second question on the sheet: which of the five checks would have caught this one? A team that finds a fault and cannot name the check has not learned the thing. Then I put up a transcript of an assistant getting this same dataset confidently wrong, and the room says where it went off the rails. Second half, your own data. Take the dataset your team is currently betting on and run the same interrogation. What is one row. How many rows are there. What is missing, and how is it coded. What changed over time. And one number checked against a source outside the file. That page is your data interrogation sheet, and it is handed in before you leave, with three lines at the bottom: what you could not answer today, who chases it, and by when. If your team has no file yet, your sheet is the shortest named route to one — which source, which access route, how many days or months, and what plan B is. Not having the data in September is fine. Not knowing how you get it is not."
    builds: "Your candidate dataset interrogated — or, if you do not hold one yet, the named access route and plan B for getting it"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 7 on secondary data collection."
    reading: "TBD"
