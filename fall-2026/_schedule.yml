  - num: 6
    slug: "06-models-uncertainty"
    date: 2026-09-30
    part: 3
    title: "Models and uncertainty"
    desc: "How an estimate is obtained from a sample, and how its uncertainty is measured. Estimators and their properties, three estimation methods, standard errors, p-values, and the difference between prediction and causal inference."
    goal: "Distinguish a parameter, an estimator and an estimate, and explain what a standard error measures. Compare estimators by their bias, efficiency and consistency. Choose a model and an estimation method for your outcome, and interpret its coefficients in the units of the problem. Read a confidence interval and a p-value correctly, and say whether your question is predictive or causal."
    a: "Most projects in this course estimate an unknown parameter: a price premium, an elasticity, a probability, an effect. This session covers how that estimate is obtained from a sample and how its uncertainty is measured. Live simulations from a population with a known mean show the sampling distribution, the standard error, and why the standard error falls with the square root of the sample size. The German tank problem compares three estimators by their bias, efficiency and consistency. The Literary Digest poll opens the cases a larger sample does not fix: bias, dependent observations, little variation in the regressor, and heavy tails. The session then covers models for continuous, binary and count outcomes, and three estimation methods: least squares, maximum likelihood and the method of moments (GMM). It ends with standard errors from formulas and from the bootstrap, a p-value computed by permutation, confidence intervals read against the smallest effect that matters, and the difference between prediction and causal inference."
    b: "Ten minutes of simulation first, driven from the front. Draw from a world you control. Watch the p-value distribution under the null. Move the sample size and the variation, and watch it shift. Then fit the same world in and out of sample, and watch an excellent-looking model fail on data it has not seen. Nothing to install. Then the cards. Each team gets an analyst who ran something and said something about it, and every one overclaims differently. A count outcome fitted by OLS and predicted below zero. A 0.03% lift called highly significant across two million users. A wide interval called no effect. An elasticity estimated off two price changes in three years. A churn probability of 112%. Work out what they are actually entitled to claim. Then a team is drawn at random to defend that while the room pushes back. The last line on the sheet is the one that matters: is your own project at risk of the same error?"
    builds: "The overclaim your own project is most at risk of making"
    books: "[Adams](https://doi.org/10.4135/9788132108498) ch. 11 on descriptive statistics and ch. 12 on correlation and regression."
    chapters: "Adams ch. 11--12"
    reading: "TBD"
    due: "Rate your teammates"
