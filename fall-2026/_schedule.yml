    b: "Six figures, each lying a different way, one per team. A truncated axis. Two axes manufacturing a correlation. A cherry-picked window. An aggregate moving opposite to every subgroup. Area scaled by radius. Counts where you needed a rate. Name the trick, then redraw it honestly. The honest version still has to make a point — that is the hard half, and the one nobody practises. Teams are drawn at random to put both versions up while the room attacks. Then the one that counts. Make the figure your own project lives or dies on: the picture that would show your effect if it is there."
