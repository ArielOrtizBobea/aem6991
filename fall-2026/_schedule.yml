  - num: 10
    slug: "10-writing"
    date: 2026-10-28
    part: 4
    title: "Writing"
    desc: "Who reads which part of a document, and how to write for each: skimmers, engaged readers and deep readers. The title, abstract, introduction and full paper nest like Russian dolls. Then the structure readers expect, one idea per paragraph, keeping a skeptical reader on your path, and plain, neutral sentences."
    goal: "Write a title, a first page and an outline that each carry your project's message at their reader's level, with one point per paragraph and each doubt answered where it arises."
    a: "Writing for the people who actually read. Readers come in three kinds, skimmers, engaged readers and deep readers, in a mix that depends on the setting, and each part of a paper is written for the reader who reaches it: one study is shown at three technical levels and under three titles, and one research team's work framed for two journals. The title, abstract, introduction and full paper then nest like Russian dolls, each carrying the whole message, and a set of dolls shows what happens when the small ones leave out the feature that identifies the paper. The 2021 paper on climate change and farm productivity is quoted version by version. Then the structure readers expect: the order of an empirical paper, a memo and the course's proposal, and the funnel from the literature to the question, drawn. Then one idea per paragraph: topic sentences, and the reverse outline that checks a draft, with a three-minute exercise summarizing a paragraph from a published study of solar farms and home prices. Then keeping the reader on your path: you choose what the reader reads and in what order, readers' minds wander, and a skeptical reader's doubts are answered in the sentence that follows the claim, with on-ramps for readers who drift. Then plain and neutral sentences: hype words, numbers in place of adjectives, six rules for verbs, terms and claims, and when to cite. Last, the mechanics of writing a paper: the sections first, then a detailed outline with one bullet per paragraph, then the prose, shown on the 2021 paper rebuilt as an outline. The writing guide carries the rest."
    b: "The project talks, after the check-in. Every team presents its project description in an order drawn at random: three minutes, timed, then one question from the room. The talks are graded against the project-description brief."
    due: "Project talk — three minutes, in session B"
    links:
      - text: "Project description brief"
        href: fall-2026/handouts/project-description.qmd
      - text: "Writing guide"
        href: fall-2026/handouts/writing-guide.qmd
    builds: "Your project told in three minutes, and the first question a room asks about it"
    books: "[Mensh and Kording (2017)](https://doi.org/10.1371/journal.pcbi.1005619) on structuring a paper, and [Przeworski and Salomon](https://law.uga.edu/sites/default/files/OnTheArtOfWritingProposals_SocialScienceResearchCouncilCompetiotions.pdf) on what a proposal's reader looks for. Both are short and free."
    chapters: "Mensh and Kording; Przeworski and Salomon"
    reading: "TBD"
  - num: 11
    slug: "11-figures"
    date: 2026-11-04
    part: 4
    title: "Visualization"
    desc: "Visualizations made to explore data and visualizations made for a reader. How to build a chart for a reader in four steps: decide what to contrast, encode it for the eye, keep it faithful to the numbers, and make it stand alone. Then diagrams that show how an idea works, and how a talk builds them one piece at a time."
    goal: "Tell a visualization made to explore data from one made for a reader. Build a chart for a reader in four steps: decide what to contrast, encode it so the eye reads it precisely, keep it faithful to the numbers, and make it stand alone. Draw a diagram of an idea, and reveal it in a talk one piece at a time. Name what is wrong with a published figure, at which step, and sketch the fix."
    a: "Visualizations have two jobs. Exploratory ones are for the author: many, quick and rough, made to understand the data and catch errors (meeting 5). Explanatory ones are for a reader or a room: few and finished, each making one point. This meeting is about the second kind. A chart for a reader makes one point by showing numbers side by side, and the point stands out by contrast with something else. It is built in four steps. First, decide what to contrast: the message in one sentence, the benchmark it needs, the quantity (nominal or real, levels or an index, counts or a rate) and the form. Second, encode it for the eye: readers judge positions on a common scale more accurately than lengths, angles, areas or colors, so ordered values need an ordered color scale and many series read best as small multiples. Third, keep it faithful: bars start at zero, two periods belong on one scale, estimates carry their intervals, and a causal title needs a causal design. Fourth, make it stand alone: the title states the finding, every mark carries information, the caption lets the figure stand alone, and a slide gets its own version. Each step is shown with a figure drawn badly and redrawn, many of them published, and with the experiments that measured how readers read them. Then diagrams, which show how the parts of an idea connect: a causal graph, a research design, a data pipeline. Every arrow in a diagram is a claim, so each meaning gets its own arrow style. And a talk builds a complex diagram one piece at a time, with one sentence for each piece, so the room follows the argument instead of reading ahead. The meeting closes with two published charts that work, and with what a proposal can draw before it has results: the design and the data it already has."
    b: "The session opens with a worked critique of a published chart. Each team then gets one published or constructed figure with something wrong in it. Using the figure guide, the team says what the figure claims, what is wrong and at which step, what the figure is entitled to claim, and sketches the redraw. Teams then present in an order drawn at random, and the room adds what they missed."
    builds: "A published figure critiqued against the four steps, and its redraw"
    books: "[Schwabish (2014)](https://doi.org/10.1257/jep.28.1.209), \"An Economist's Guide to Visualizing Data\", is short, free and written for economists. Wilke's [*Fundamentals of Data Visualization*](https://clauswilke.com/dataviz/) and Healy's [*Data Visualization*](https://socviz.co) are free online. Zelazny, *Say It With Charts*, for choosing a chart from its message."
    chapters: "Schwabish (2014); Zelazny"
    reading: "TBD"
