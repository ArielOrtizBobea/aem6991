# AEM 6991 · Fall 2026 — single source of truth for the meeting schedule.
#
# The front-door table, the syllabus table, the _quarto.yml sidebar, and the
# session pages are all generated from this file by _tools/build_site.R.
# Edit here and re-run; never edit the generated artifacts by hand.
#
# To start a new year: copy this file into the new offering's folder, shift
# the dates, and edit forward. The diff is the year-over-year change log.
#
# Fields
#   num       meeting number; omit for a non-meeting row (recess)
#             (the key is `num`, not `n` — YAML 1.1 reads a bare `n` as false)
#   date      ISO date of the meeting
#   part      part of the course this meeting belongs to
#   title     full title, used as the session page heading
#   short     compressed title for the sidebar (falls back to title)
#   slug      session page filename, fall-2026/sessions/<slug>.qmd
#   desc      one-to-two sentence description for the front-door table
#   a         session A (2:05–3:15) — concept, with worked examples
#   b         session B (3:35–4:30) — applied to the team's own project.
#             Every session B opens with a ten-minute team stand-up.
#   quizzes   how many quizzes this meeting (0 or 1); default 1
#   reading   assigned reading, quizzed at 2:05
#   due       anything due on or around this meeting
#   note      free text, used for recess rows
#   reschedule  set when instructor travel puts this date in question. Marks
#             the date with an asterisk everywhere and prints the footnote.

term: "Fall 2026"
meets: "Wednesdays, 2:00–4:30 pm"
parts:
  - id: 1
    tab: "Question & team"
    title: "The question, the team, and the writing"
    blurb: >
      Turn an interest into a question that can actually be answered, learn
      to write the problem down, and build a team that will still be
      functional in November.

  - id: 2
    tab: "Evidence & inference"
    title: "Evidence, models, and inference"
    blurb: >
      The conceptual core. What a causal claim is, what the standard models
      estimate, where uncertainty comes from, the difference between
      explaining and predicting, and how inference goes wrong. Taught on
      examples from industry and the news, before anyone opens a dataset.

  - id: 3
    tab: "Designs"
    title: "Research designs"
    blurb: >
      The ways applied economists get a credible estimate, from conditioning
      on observables to designs built on found variation — what variation
      each exploits, what each assumes, and how each fails.

  - id: 4
    tab: "Data & access"
    title: "Measurement, data, and getting hold of it"
    blurb: >
      The step most projects skip. Turning a construct into something a
      dataset can hold, working out what the design actually demands, and
      then the practical business of obtaining it — sources, proprietary
      access, data-use agreements, the IRB, and what scraping and APIs can
      and cannot get you.

  - id: 5
    tab: "Reporting & pitch"
    title: "Seeing, writing, and pitching"
    blurb: >
      Seeing what a figure shows and hides, writing the design paper,
      keeping a team and a project functional, and the proposal that carries
      into AEM 6992.

# Individual writing pieces, assessed together as the writing portfolio.
writing:
  - num: 1
    name: "Problem statement"
    len: "1 page"
    due_meeting: 3
    desc: "Your project's problem in one page: what the question is, why it matters, and what the answer would change. Peer-swapped and critiqued in class the day it is due."
  - num: 2
    name: "Limitation paragraph"
    len: "½ page"
    due_meeting: 9
    desc: "The single biggest threat to your team's design, stated plainly, and what you would do about it. Written after the designs are on the table and before the data is."
  - num: 3
    name: "Plain-language summary"
    len: "1 page"
    due_meeting: 12
    desc: "Your project explained to a decision-maker who is not an economist. No jargon, no hedging, and the 'so what' in the first sentence."
  - num: 4
    name: "Referee report"
    len: "2 pages"
    due_meeting: 15
    desc: "A structured critique of another team's design paper, on the template used in class. Due in the exam period."

# Team deliverables. The syllabus table is generated from this block, so the
# dates cannot drift from the meeting schedule.
deliverables:
  - num: 1
    name: "Research problem presentation"
    weight: "5 %"
    due_meeting: 6
    when: "in class"
    desc: "5 slides, 5 minutes: the problem, why it matters, what is already known, and which archetype it is. Milestone 1."
  - num: 2
    name: "Problem statement & literature review"
    weight: "10 %"
    due_meeting: 6
    when: "end of week"
    desc: "~5 pages: the problem, practical and theoretical justification, conceptual model, what the literature establishes, work plan."
  - num: 3
    name: "Data feasibility memo"
    weight: "5 %"
    due_meeting: 11
    when: "end of week"
    desc: "~2 pages: the exact data you will use, who holds it, how you get it, what it costs, what it measures, and your fallback if it falls through."
  - num: 4
    name: "Research design paper"
    weight: "15 %"
    due_meeting: 13
    when: "end of week; draft workshopped in class"
    desc: "~5 pages: question, identification strategy and its assumptions, unit of analysis and sample, data, threats to internal validity, external validity, work plan for the spring."
  - num: 5
    name: "Final presentation & artifact"
    weight: "5 %"
    due_meeting: 14
    when: "in class"
    desc: "10-minute presentation plus a consolidating artifact — poster or written plan, format announced by week 10."

meetings:
  - num: 1
    slug: "01-questions"
    short: "Questions & the literature"
    date: 2026-08-26
    part: 1
    title: "Where questions come from"
    desc: "What a capstone is and is not, and the five shapes a good one takes: evaluation, preference and pricing, prediction and risk, diagnosis and benchmarking, feasibility and landscape. The anti-patterns, the feasibility filter, and how to search the literature well enough to know your question has not already been answered."
    a: "The capstone arc into AEM 6992, and what this is not: you are not writing a paper for a journal, you are building the analysis a competent team needs before a decision that costs real money. Five project archetypes — evaluation, preference and pricing, prediction and risk, diagnosis and benchmarking, feasibility and landscape — with what each can claim, what design it needs, and how each fails. The anti-patterns, and the four-question feasibility filter. Ground rules for AI use, disclosure, and the fabricated-citation problem"
    b: "Literature workshop: searching systematically, screening what you find, and verifying every reference by opening it. Then write five candidate questions from your own interests — each labeled with its archetype and run through the feasibility filter"
    quizzes: 0
    reading: "None"
    due: "Statement of interest, before meeting 2"

  - num: 2
    slug: "02-problem-and-teams"
    short: "Writing the problem; teams"
    date: 2026-09-02
    part: 1
    title: "Writing the problem, and building the team"
    desc: "Academic writing starts here, because the first paper is due in four weeks. What a problem statement actually does, and how a pile of sources becomes prose. Then team formation, the charter, and the conflict protocol — agreed while everyone is still getting along."
    a: "Academic writing I — the research problem. What a problem statement does and what it is not: scope, unit, population, and the 'so what' in the first sentence rather than the fourth paragraph. How a synthesis matrix becomes prose. The failure modes on the page — the topic with no question, hedging, the buried claim, the literature review that reviews without arguing"
    b: "Team formation and the team charter. The conflict protocol and the division of labour, agreed in writing now rather than negotiated in November: who does what, what happens when someone misses a deadline, and when to escalate to me. The weekly stand-up starts today"
    reading: "TBD"
    due: "Team charter, same day · Writing 1 assigned"

  - num: 3
    slug: "03-causal-language"
    short: "Causal language"
    date: 2026-09-09
    part: 2
    title: "Causal language"
    desc: "Counterfactuals and potential outcomes, and why a comparison is a claim about a world that did not happen. Causal graphs: confounders, colliders, mediators, and back-door reasoning."
    a: "Counterfactuals and potential outcomes; why every comparison is a claim about a world that did not happen. Causal graphs: confounders, colliders, mediators, back-door reasoning — and why controlling for everything makes things worse"
    b: "Draw the graph for your own project. Then Writing 1 is peer-swapped and critiqued in class — you will read somebody else's problem statement before you read your own again"
    reading: "TBD"
    due: "Writing 1 — problem statement"

  - num: 4
    slug: "04-models-uncertainty"
    short: "Models & uncertainty"
    date: 2026-09-16
    part: 2
    title: "Models, uncertainty, and prediction"
    desc: "What the standard models estimate and how to read a coefficient in the units of the problem. Where uncertainty comes from and what a p-value is not. And the distinction that decides half your projects: explaining versus predicting."
    a: "Linear regression, non-linear models, and count models — described, not derived: what each estimates and how to read a coefficient in the units of the problem. Then where uncertainty comes from: residuals and errors, sampling variation, what a standard error states, where p-values come from and what they are not. Finally the distinction that decides half the projects in this room — explaining versus predicting, and why a model that predicts well may tell you nothing about what to do"
    b: "Simulation lab: draw from a world you control. Watch the p-value distribution under the null, then change the sample size and the variation and watch it move. Then fit the same world in-sample and out-of-sample, and watch a model that looks excellent fail on data it has not seen. Nothing to install, no code to write"
    reading: "TBD"
    due: ~

  - num: 5
    slug: "05-inference-goes-wrong"
    short: "How inference goes wrong"
    date: 2026-09-23
    part: 2
    title: "How inference goes wrong"
    desc: "Bias from omitted variables, sorting and selection, measurement error, and reverse causality — and false precision from ignored dependence, multiple testing, and specification search."
    a: "Bias: omitted variables, sorting and selection, measurement error (classical and not), reverse causality — what each does to the estimate and in which direction. False precision: dependence ignored, multiple testing, specification search"
    b: "Take a published claim apart in breakouts: which failure is doing the damage, and would more data fix it?"
    reading: "TBD"
    due: ~
    reschedule: "Instructor traveling — this meeting is held remotely"

  - num: 6
    slug: "06-selection-on-observables"
    short: "Conditioning on observables"
    date: 2026-09-30
    part: 2
    title: "Conditioning on what you can observe"
    desc: "Identifying an effect by controlling for what you can measure: controls, matching, and the causal reading of a regression coefficient. The workhorse of applied work — and the assumption it rests on, which is also its ceiling."
    a: "What it means to identify an effect by conditioning on observables: controls, matching, and when a regression coefficient can be read causally. Why 'I added controls' is a claim about the graph rather than a technique, and exactly what would have to be true for it to hold"
    b: "Milestone 1: each team presents its research problem in five minutes and takes questions from the room. Then the first peer evaluation"
    reading: "TBD"
    due: "Research problem presentation, in class · Peer evaluation 1 · Problem statement & literature review, end of week"

  - num: 7
    slug: "07-designs-i"
    short: "Research designs I"
    date: 2026-10-07
    part: 3
    title: "Research designs I"
    desc: "Experiments, instrumental variables, and regression discontinuity: the variation each exploits, the assumption each requires, and how each fails."
    a: "Experiments; instrumental variables; regression discontinuity. What variation each exploits, what each assumes, how each fails, and what it looks like when it is done well"
    b: "Scenario clinic: given a question, would any of these three work here?"
    reading: "TBD"
    due: ~

  - num: 8
    slug: "08-designs-ii"
    short: "Research designs II"
    date: 2026-10-14
    part: 3
    title: "Research designs II"
    desc: "Difference-in-differences, panel data with local fixed effects, and event studies: which identifying variation survives the fixed effects, and what assumption is left carrying the estimate."
    a: "Difference-in-differences; panel data with local fixed effects; event studies. What identifying variation survives once the fixed effects are in, and what assumption you are leaning on"
    b: "Name your own project's design, and the assumption you would have to defend"
    reading: "TBD"
    due: ~

  - num: 9
    slug: "09-measurement"
    short: "Measurement & data needs"
    date: 2026-10-21
    part: 4
    title: "Measurement, and what the design demands"
    desc: "Turning a construct into something a dataset can hold — the step where most capstones actually die. Then working backwards from the chosen design to the data it requires: unit, aggregation, frequency, span, and coverage."
    a: "Constructs and operationalization: how you turn 'sustainability', 'financial literacy', or 'market power' into a variable somebody could actually record, and what makes that measure defensible or indefensible. Validity, and what a proxy costs you. Then working backwards from the design to its data requirements: unit of observation, level of aggregation, time frequency, span, coverage, and which comparisons the data has to contain — can this be done with county-level data, or does it need individuals?"
    b: "What to ask of a dataset before trusting anything it says: what is one row? how many are there? what is missing, and is it missing at random? what is the range, and are the extremes real? what changed over time, and did the definition change with it? Then the measurement clinic — the variable your question actually needs, and whether anything on earth measures it"
    reading: "TBD"
    due: "Writing 2 — limitation paragraph"
    reschedule: "Instructor traveling — moves to Oct 20 or Oct 22; date to be confirmed"

  - num: 10
    slug: "10-getting-data"
    short: "Getting the data"
    date: 2026-10-28
    part: 4
    title: "Getting hold of the data"
    desc: "The practical business of obtaining data: what exists and who holds it, what proprietary access and a data-use agreement really cost in time, what the IRB needs and when, and what scraping and APIs can and cannot get you. Then how to write the memo that proves your data is real."
    a: "The landscape: administrative records, official statistics, firm and platform data, purchased panels — what each costs in money and in months. Proprietary access and data-use agreements: who signs, how long it takes, and what they forbid you from publishing. Research ethics and the Cornell IRB: what needs approval, what does not, and how long it takes. Then scraping and APIs at awareness level — what they are, what they can and cannot get you, what the terms of service and the law actually say, and when paying for a licence is the cheaper answer. We do not write scrapers in this course; you need to know what to ask for and what it costs"
    b: "Academic writing II — the memo. Writing to a decision-maker rather than an examiner: the two-page discipline, the bottom line first, and the fallback that shows you thought about failure. Then the acquisition clinic: each team names its source, its access route, its timeline, and its plan B"
    reading: "TBD"
    due: "Data feasibility memo assigned"

  - num: 11
    slug: "11-midterm-interrogating-data"
    short: "Midterm & interrogating data"
    date: 2026-11-04
    part: 4
    title: "Midterm; interrogating data with an assistant"
    desc: "The midterm asks you to design a study for a given situation in writing. Then the hands-on half: driving an assistant across real data, and the checks that catch a wrong answer without reading the code."
    a: "**Midterm** — you are given a situation and asked to design a study to evaluate it, in writing: the question, the design, what data it requires, and what would undermine it"
    b: "Real data in front of you, and the checklist from meeting 9 put to work through an assistant: summaries, joins, quick plots. Then the harder half — knowing whether the answer is right without reading the code. Row counts across a join, totals against a published figure, five raw records read by hand. What not to upload, and why"
    quizzes: 0
    reading: "Review"
    due: "Data feasibility memo, end of week"

  - num: 12
    slug: "12-seeing-data"
    short: "Seeing the data"
    date: 2026-11-11
    part: 5
    title: "Seeing what is in the data"
    desc: "Which figure answers which question, and why. Exploring distributions, time, and space — then the flip side: what figures hide through aggregation, scale, binning, projection, and chosen windows."
    a: "Which figure answers which question, and why. Exploring distributions, time, and space; developing the instinct to be curious about a dataset before modelling it. Then the flip side: what figures hide — aggregation, scale, binning, projection, cherry-picked windows — and how to read a published figure for what it is not showing"
    b: "Rebuild a published figure from its underlying data, then produce the version you think is more honest"
    reading: "TBD"
    due: "Writing 3 — plain-language summary · Exercise 1 — interrogate a dataset, end of week"

  - num: 13
    slug: "13-writing-collaboration"
    short: "Writing the design paper"
    date: 2026-11-18
    part: 5
    title: "Writing the design paper; collaboration"
    desc: "The design paper as a genre: how to write an identification section, and how to state a limitation without gutting your own project. Then how to referee somebody else's — which is the same skill from the other side — and how to keep a project reproducible."
    a: "Academic writing III — the research design paper. Structure, and what each section is for. Writing the identification section: naming your design, its assumption, and what would break it. Stating a limitation honestly without gutting the project. What a referee actually looks for — which is also how you will write your own referee report. Then reproducibility at awareness level: where files live, naming, what 'the final version' means, and when version control is worth the cost"
    b: "Bring a draft. Workshop the design paper in rotation, then Milestone 2: each team presents its design and the assumption it is defending. Second peer evaluation"
    reading: "TBD"
    due: "Design paper draft, in class · Milestone 2 presentation · Peer evaluation 2 · Research design paper, end of week"
    reschedule: "Instructor traveling — moves to Nov 17 or Nov 19; date to be confirmed"

  - date: 2026-11-25
    note: "Thanksgiving recess — no class"

  - num: 14
    slug: "14-pitch"
    short: "The pitch"
    date: 2026-12-02
    part: 5
    title: "The pitch"
    desc: "Final presentations and peer review, then the handoff to AEM 6992."
    a: "Final presentations and peer review"
    b: "The handoff to AEM 6992: what each team does over the break"
    quizzes: 0
    reading: "None"
    due: "Exercise 2 — rebuild and critique a figure, Dec 1 · Final presentation & artifact, in class · Writing 4 — referee report, exam period"
