# AEM 6991 · Fall 2026 — single source of truth for the meeting schedule.
#
# The front-door table, the syllabus table, the _quarto.yml sidebar, and the
# session pages are all generated from this file by _tools/build_site.R.
# Edit here and re-run; never edit the generated artifacts by hand.
#
# To start a new year: copy this file into the new offering's folder, shift
# the dates, and edit forward. The diff is the year-over-year change log.
#
# Fields
#   num       meeting number; omit for a non-meeting row (recess)
#             (the key is `num`, not `n` — YAML 1.1 reads a bare `n` as false)
#   date      ISO date of the meeting
#   part      part of the course this meeting belongs to
#   title     full title, used as the session page heading
#   short     compressed title for the sidebar (falls back to title)
#   slug      session page filename, fall-2026/sessions/<slug>.qmd
#   desc      one-to-two sentence description for the front-door table
#   goal      what a student can DO after this meeting. One sentence,
#             written as a capability, not a topic list.
#   a         session A (2:05–3:15) — concept, with worked examples
#   b         session B (3:35–4:30). THE RULE, in two halves:
#             (1) TEST what session A taught, on a shared case — everyone
#                 works the same object, so teams can be compared and
#                 corrected, and a deliberately bad example can be used.
#             (2) APPLY it to your own project — which is what makes the
#                 project advance a piece a week instead of being written
#                 in November.
#             Half (2) is the artifact submitted before you leave, and
#             `builds:` records what it contributes. Logistics — team
#             formation, peer evaluation, presentations — ride along
#             inside B; they never replace it. Deliberate exceptions:
#             meeting 11 (A is the midterm) and meeting 14 (the pitch).
#             Every session B opens with a ten-minute team check-in.
#
#             THE DEFENCE, used in meetings 2, 3, 7 and 8: every team
#             works its own card at the same time, then ONE team is drawn
#             AT RANDOM to defend at the front while the rest of the room
#             attacks. Draw again, and again, as far as the clock allows.
#             Random is the whole point — nobody knows whether they are
#             up, so every team has to be ready, and being ready is the
#             thing being taught. Points for attacks that land, as in the
#             meeting-1 relay.
#   builds    what this meeting's session B contributes to the team's
#             final design paper. Generates the "how your paper gets
#             built" table in the syllabus.
#   quizzes   how many quizzes this meeting (0 or 1); default 1
#   reading   assigned reading, quizzed at 2:05
#   due       anything due on or around this meeting
#   links     extra sidebar entries belonging to this meeting, each with
#             `text` and `href`. They sit under the meeting, indented to
#             align with the meeting titles.
#   note      free text, used for recess rows
#   reschedule  set when instructor travel puts this date in question. Marks
#             the date with an asterisk everywhere and prints the footnote.

term: "Fall 2026"
meets: "Wednesdays, 2:00–4:30 pm"
parts:
  - id: 1
    tab: "The question"
    title: "The question"
    blurb: >
      Turn an interest into a question that can actually be answered — and
      learn to read the literature well enough to know whether it already
      has been.

  - id: 2
    tab: "Inference"
    title: "Evidence, models, and inference"
    blurb: >
      The conceptual core. What a causal claim is, what the standard models
      estimate, where uncertainty comes from, the difference between
      explaining and predicting, and how inference goes wrong — taught on
      examples from industry and the news, before anyone opens a dataset.
      Teams form in the first meeting of this part, and it closes by writing
      the problem up and presenting it.

  - id: 3
    tab: "Designs"
    title: "Research designs"
    blurb: >
      The ways applied economists get a credible estimate, from conditioning
      on observables to designs built on found variation — what variation
      each exploits, what each assumes, and how each fails.

  - id: 4
    tab: "Data & access"
    title: "Measurement, data, and getting hold of it"
    blurb: >
      The step most projects skip. Turning a construct into something a
      dataset can hold, working out what the design actually demands, and
      then the practical business of obtaining it — sources, proprietary
      access, data-use agreements, the IRB, and what scraping and APIs can
      and cannot get you.

  - id: 5
    tab: "Reporting"
    title: "Seeing, writing, and pitching"
    blurb: >
      Seeing what a figure shows and hides, writing the design paper,
      keeping a team and a project functional, and the proposal that carries
      into AEM 6992.

# Individual writing pieces, assessed together as the writing portfolio.
# Two of them are reverse-outlining: going from a finished text back to the
# outline that must have produced it. You cannot build an outline until you
# can see one.
writing:
  - num: 1
    name: "Reverse outline"
    len: "1 page"
    due_meeting: 7
    desc: "Take an assigned published paper and reconstruct its outline: one topic sentence per paragraph, in order, in your own words. Then say in three lines what the argument actually is."
  - num: 2
    name: "Reverse outline and repair"
    len: "1 page"
    due_meeting: 9
    desc: "A badly organised passage. Give its real outline, then the outline it should have had, and say what moved and why."
  - num: 3
    name: "Plain-language summary"
    len: "1 page"
    due_meeting: 12
    desc: "Your project explained to a decision-maker who is not an economist. No jargon, no hedging, and the 'so what' in the first sentence."
  - num: 4
    name: "Referee report"
    len: "2 pages"
    due_date: 2026-12-15
    desc: "A structured critique of another team's design paper, on the template used in class. Start from its outline: if you cannot reconstruct one, that is the finding."

# Team deliverables. Nothing is submitted as a finished paper out of nowhere:
# each written product is built in stages — the outline is fixed before the
# sketch, and the sketch before the prose. The syllabus table is generated
# from this block, so the dates cannot drift from the meeting schedule.
deliverables:
  - num: 1
    name: "Research problem presentation"
    weight: "5 %"
    due_meeting: 6
    when: "in class"
    desc: "5 slides, 5 minutes: the problem, why it matters, what is already known, and which archetype it is. The first of your two in-class presentations."

  - num: 2
    name: "Problem and literature"
    weight: "10 %"
    desc: "The research problem, its practical and theoretical justification, the conceptual model, and what the literature establishes. Built in three stages."
    stages:
      - stage: "Outline"
        due_meeting: 7
        desc: "One topic sentence per paragraph, in order, and nothing else. If the argument does not work here it will not work at 5,000 words."
      - stage: "Sketch"
        due_meeting: 8
        desc: "Each topic sentence with its evidence underneath in note form — the citation, the number, the figure you will point at. Still not prose."
      - stage: "Full"
        due_meeting: 9
        when: "end of week"
        desc: "~5 pages. The sketch written out, plus the work plan and references."

  - num: 3
    name: "Data feasibility memo"
    weight: "5 %"
    desc: "The exact data you will use, who holds it, how you get it, what it costs, what it measures, and your fallback if it falls through."
    stages:
      - stage: "Outline"
        due_meeting: 10
        when: "in class"
        desc: "Six topic sentences, drafted in the session where the memo is taught. A memo is short enough to outline in the room."
      - stage: "Full"
        due_meeting: 11
        when: "end of week"
        desc: "~2 pages, bottom line first."

  - num: 4
    name: "Research design paper"
    weight: "15 %"
    desc: "Question, identification strategy and its assumptions, unit of analysis and sample, data, threats to internal validity, external validity, and the work plan for the spring."
    stages:
      - stage: "Outline"
        due_meeting: 12
        desc: "Topic sentences only. The identification section is the one to get right here."
      - stage: "Sketch"
        due_meeting: 13
        when: "in class"
        desc: "Brought to class and workshopped in rotation. Evidence under each topic sentence, still in note form."
      - stage: "Full"
        due_date: 2026-12-01
        desc: "~5 pages, written out from the workshopped sketch."

  - num: 5
    name: "Final presentation, and the thing you leave behind"
    weight: "5 %"
    due_meeting: 14
    when: "in class"
    desc: "A 10-minute presentation, plus one thing that pulls the whole semester together — a poster or a written plan. Which one is announced by week 10."

meetings:
  - num: 1
    slug: "01-questions"
    date: 2026-08-26
    part: 1
    title: "Finding a question"
    desc: "What a capstone is and is not, and the five shapes a good one takes: evaluation, preference and pricing, prediction and risk, diagnosis and benchmarking, feasibility and landscape. The anti-patterns, the feasibility filter, and how to search the literature well enough to know your question has not already been answered."
    goal: "Turn a dataset you did not choose into a question worth asking, break somebody else's question by naming the filter it fails, and know where to look for data you already have access to."
    a: "The capstone arc into AEM 6992, and what this is not: you are not writing a paper for a journal, you are building the analysis a competent team needs before a decision that costs real money. Five project archetypes — evaluation, preference and pricing, prediction and risk, diagnosis and benchmarking, feasibility and landscape — with what each can claim, what design it needs, and how each fails. The anti-patterns, and the four-question feasibility filter. Ground rules for AI use, disclosure, and the fabricated-citation problem"
    b: "Where to look: the Cornell library's licensed holdings and the Dewey marketplace the Johnson College subscribes to, browsed live. Then the question relay, in groups and against the clock. Each group gets a dataset and writes the best question it can. Datasets and questions then rotate: your next job is to break the question you inherit, naming which filter kills it, before writing your own on a dataset you have not seen. Third round you may combine any two datasets you have held. Points for questions that survive and for breaks that land"
    builds: "Five candidate questions, filtered — one of which becomes the project"
    quizzes: 0
    reading: "None"
    due: "One page on what you want to work on and why — before meeting 2"
    links:
      - text: "Project ideas"
        href: fall-2026/project-ideas.qmd

  - num: 2
    slug: "02-causal-language"
    date: 2026-09-02
    part: 2
    title: "Causal language"
    desc: "Counterfactuals and potential outcomes, and why a comparison is a claim about a world that did not happen. Causal graphs: confounders, colliders, mediators, and back-door reasoning."
    goal: "Draw your own project's causal graph, say which variable you must condition on and which you must not touch, and leave with your team's ground rules agreed in writing."
    a: "Counterfactuals and potential outcomes; why every comparison is a claim about a world that did not happen. Causal graphs: confounders, colliders, mediators, back-door reasoning — and why controlling for everything makes things worse. Then the map for the rest of this half: every design we meet is a different way of closing a back door, and you will draw each one before you hear what it is called"
    b: "First, teams. You are put into one, and it writes down its own ground rules while everybody still gets along rather than negotiating in November — who does what, what happens when somebody misses a deadline, how you settle a disagreement. One page, signed, handed in. Then your team's first job together: each team draws a card carrying a real causal claim somebody is acting on — a board paper, a marketing deck, a widely shared post — and every card is broken in a different way. Draw the graph behind it, then name the failure in this morning's vocabulary: confounder, collider, mediator, selection, reverse causality. Then a team is drawn at random to defend its diagnosis at the front while the rest of the room attacks, and we draw again as the clock allows — you will not know whether you are up, which is the point. Card 3 is a collider and card 5 is a mediator, and those two are where the morning either landed or did not"
    builds: "Your team's ground rules, and a diagnosed causal graph"
    reading: "TBD"
    due: "Your team's written ground rules — agreed and handed in today"
    links:
      - text: "Working in a team"
        href: fall-2026/teamwork.qmd
      - text: "Causal claim cards"
        href: fall-2026/handouts/causal-claims.qmd

  - num: 3
    slug: "03-models-uncertainty"
    date: 2026-09-09
    part: 2
    title: "Models and uncertainty"
    desc: "What the standard models estimate and how to read a coefficient in the units of the problem. Where uncertainty comes from and what a p-value is not. And the distinction that decides half your projects: explaining versus predicting."
    goal: "Read a coefficient in the units of the problem, say what a p-value does and does not tell you, and tell an explanatory question apart from a predictive one."
    a: "Linear regression, non-linear models, and count models — described, not derived: what each estimates and how to read a coefficient in the units of the problem. Then where uncertainty comes from: residuals and errors, sampling variation, what a standard error states, where p-values come from and what they are not. Finally the distinction that decides half the projects in this room — explaining versus predicting, and why a model that predicts well may tell you nothing about what to do"
    b: "Ten minutes of simulation first, driven from the front: draw from a world you control, watch the p-value distribution under the null, move the sample size and the variation and watch it shift, then fit the same world in and out of sample and watch an excellent-looking model fail on data it has not seen. Nothing to install, no code to write. Then the cards. Each team gets an analyst who has run something and said something about it, and every one of them overclaims in a different way — a count outcome fitted by OLS and predicted below zero, a 0.03% lift called highly significant across two million users, a wide interval called no effect, an elasticity estimated off two price changes in three years, a churn probability of 112%. Work out what they are actually entitled to claim. Then a team is drawn at random to defend that at the front while the room pushes back, and we draw again while the clock allows. Last line on the sheet is the one that matters: is your own project at risk of the same error?"
    builds: "The overclaim your own project is most at risk of making"
    reading: "TBD"
    due: ~
    links:
      - text: "Results critique cards"
        href: fall-2026/handouts/results-claims.qmd

  - num: 4
    slug: "04-inference-goes-wrong"
    date: 2026-09-16
    part: 2
    title: "How inference fails"
    desc: "Bias from omitted variables, sorting and selection, measurement error, and reverse causality — and false precision from ignored dependence, multiple testing, and specification search."
    goal: "Take a published claim apart: name the specific failure, say which direction it pushes the estimate, and say whether more data would fix it."
    a: "Bias: omitted variables, sorting and selection, measurement error (classical and not), reverse causality — what each does to the estimate and in which direction. False precision: dependence ignored, multiple testing, specification search"
    b: "First, together: one published claim, taken apart. Which failure is doing the damage, and would more data fix it? Then the same move on a paper from your own project's literature — and write down the one threat your own design will have to survive, because you will be answering it in November"
    builds: "The one threat your design will have to survive"
    reading: "TBD"
    due: ~

  - num: 5
    slug: "05-selection-on-observables"
    date: 2026-09-23
    part: 2
    title: "Controls and matching"
    desc: "Identifying an effect by controlling for what you can measure: controls, matching, and the causal reading of a regression coefficient. The workhorse of applied work — and the assumption it rests on, which is also its ceiling."
    goal: "Draw the back doors a set of controls closes, and state exactly what would have to be true for your regression coefficient to be read causally."
    a: "We start where every design meeting from here starts — at the graph. Conditioning on observables, drawn: which back doors a set of controls closes, and the one you cannot see well enough to close. Then controls and matching in practice, and when a regression coefficient can be read causally. Why 'I added controls' is a claim about the graph rather than a technique, and exactly what would have to be true for it to hold"
    b: "Back to the graph you drew in meeting 2: could you close every back door with data you could actually obtain? Breakout rooms, then report back"
    builds: "Which back doors you can close, and with what data"
    reading: "TBD"
    due: ~
    reschedule: "Instructor traveling — this meeting is held remotely"

  - num: 6
    slug: "06-writing-the-problem"
    date: 2026-09-30
    part: 2
    title: "Writing the problem"
    desc: "The conceptual half is done and the first paper is due, so this is where writing gets taught. What a problem statement does, how a pile of sources becomes an argument, and then each team presents its problem to the room."
    goal: "Reconstruct the outline behind somebody else's paper, build your own the same way — topic sentence by topic sentence — and defend your research problem in front of the room."
    a: "Academic writing I — the method. A paper is built outline first: one topic sentence per paragraph, in order, before any prose exists. We start backwards, taking a published paper apart into the outline that must have produced it — which is also this week's exercise, and the fastest way to see that good writing has a skeleton. Then forwards: outline, then sketch, then full text. Every written product in this course is submitted in those stages, so the argument is fixed before the sentences are. Then what a problem statement in particular has to do — scope, unit, population, and the 'so what' in the first sentence rather than the fourth paragraph — and the failure modes: the topic with no question, hedging, the buried claim, the review that reviews without arguing"
    b: "Each team presents its research problem in five minutes — and the presentation is this morning's method under test, because your five slides are an outline. One topic sentence per slide, no bullet lists. If the argument does not stand up as five sentences it will not stand up at five pages, and everyone in the room will see which it is. Questions are aimed at the skeleton: where does the argument jump? Then you rate your teammates for the first time"
    builds: "Your problem statement, as an outline"
    reading: "TBD"
    due: "Present your research problem, in class · Rate your teammates"

  - num: 7
    slug: "07-designs-i"
    date: 2026-10-07
    part: 3
    title: "Research designs I"
    desc: "Experiments, instrumental variables, and regression discontinuity: the variation each exploits, the assumption each requires, and how each fails."
    goal: "Draw the graph for an experiment, an instrument, and a discontinuity, and say whether any of the three could work for your question."
    a: "Three designs, each drawn before it is described. Experiments: randomisation cuts every arrow into treatment, so there is no back door left to close. Instrumental variables: an arrow into treatment and none into the outcome except through it — the exclusion restriction is that missing arrow, which is why it cannot be tested. Regression discontinuity: nothing else jumps at the cutoff. For each: what variation it exploits, what it assumes, how it fails, and what it looks like done well"
    b: "Each team draws a setting nobody in the room owns — a bank with an email list, a scholarship cutoff, an NGO that gave filters to whoever asked. Fifteen minutes to draw the graph, name a design, and state the assumption carrying it. Then teams are drawn at random to defend for four minutes while the room attacks: what breaks this? Nobody knows in advance whether they are up. One card cannot be answered honestly at all, and the team holding it has to be willing to say so. Last: is an experiment, an instrument, or a discontinuity actually open to your own project? Most teams find the answer is no, and finding that out today rather than in November is the point"
    builds: "Whether an experiment, instrument or discontinuity is open to you"
    reading: "TBD"
    due: "Problem & literature — outline · Writing 1 — reverse outline"
    links:
      - text: "Design scenarios"
        href: fall-2026/handouts/design-scenarios.qmd

  - num: 8
    slug: "08-designs-ii"
    date: 2026-10-14
    part: 3
    title: "Research designs II"
    desc: "Difference-in-differences, panel data with local fixed effects, and event studies: which identifying variation survives the fixed effects, and what assumption is left carrying the estimate."
    goal: "Draw your own project's design as a graph and name the single assumption carrying the estimate — the one you would have to defend to a sceptic."
    a: "The same discipline on harder designs, each drawn first. Difference-in-differences: the confounders you cannot measure are the ones that do not move, and parallel trends is what that assumption looks like on the graph. Panel data with local fixed effects: which arrows the fixed effects erase, and which survive them untouched. Event studies: the same picture with time on it. For each, what identifying variation is left once the fixed effects are in, and what assumption is carrying the estimate"
    b: "Same format, higher stakes. First a card apiece — a staggered rollout, a state border, a fee that changed for accounts opened after a date — fifteen minutes to draw it and name the design. Then the part that counts: teams are drawn at random to put up their OWN project's design, draw the graph, state the assumption carrying the estimate, and defend it while the room tries to break it. Everyone presents eventually, but nobody knows when. Whatever survives is the figure that goes in your identification section, so draw it to keep — and write down the attack that landed, because that is your limitations paragraph"
    builds: "Your design defended in public, plus the attack that landed — the identification section and the limitation"
    reading: "TBD"
    due: "Problem & literature — sketch"

  - num: 9
    slug: "09-measurement"
    date: 2026-10-21
    part: 4
    title: "Measurement and data"
    desc: "Turning a construct into something a dataset can hold — the step where most capstones actually die. Then working backwards from the chosen design to the data it requires: unit, aggregation, frequency, span, and coverage."
    goal: "Turn your central construct into a variable somebody could actually record, and specify the unit, frequency, span, and coverage your design demands."
    a: "Constructs and operationalization: how you turn 'sustainability', 'financial literacy', or 'market power' into a variable somebody could actually record, and what makes that measure defensible or indefensible. Validity, and what a proxy costs you. Then working backwards from the design to its data requirements: unit of observation, level of aggregation, time frequency, span, coverage, and which comparisons the data has to contain — can this be done with county-level data, or does it need individuals?"
    b: "What to ask of a dataset before trusting anything it says: what is one row? how many are there? what is missing, and is it missing at random? what is the range, and are the extremes real? what changed over time, and did the definition change with it? Then the measurement clinic — the variable your question actually needs, and whether anything on earth measures it"
    builds: "Your key variable, operationalised, and what data the design demands"
    reading: "TBD"
    due: "Problem & literature — full, end of week · Writing 2 — reverse outline and repair"
    reschedule: "Instructor traveling — moves to Oct 20 or Oct 22; date to be confirmed"

  - num: 10
    slug: "10-getting-data"
    date: 2026-10-28
    part: 4
    title: "Getting the data"
    desc: "The practical business of obtaining data: what exists and who holds it, what proprietary access and a data-use agreement really cost in time, what the IRB needs and when, and what scraping and APIs can and cannot get you. Then how to write the memo that proves your data is real."
    goal: "Name your data source, its access route, its timeline, and your plan B — and know whether you need IRB approval or a data-use agreement before January."
    a: "The landscape: administrative records, official statistics, firm and platform data, purchased panels — what each costs in money and in months. Start with what Cornell already pays for: the library's licensed holdings and the Dewey marketplace through the Johnson College membership, met in meeting 1 and worked properly here. A surprising number of capstones propose buying data the College already subscribes to. Proprietary access and data-use agreements: who signs, how long it takes, and what they forbid you from publishing. Research ethics and the Cornell IRB: what needs approval, what does not, and how long it takes. Then scraping and APIs at awareness level — what they are, what they can and cannot get you, what the terms of service and the law actually say, and when paying for a licence is the cheaper answer. We do not write scrapers in this course; you need to know what to ask for and what it costs"
    b: "The acquisition clinic — this morning applied to your own project. Which source, exactly. What the access route is. How long it takes. What it costs. And what plan B is when it falls through. Then write that down as six topic sentences, because those six sentences are your memo outline and it is due today. Ten minutes first on what the memo genre demands: the bottom line in the first line, and a fallback that proves you thought about failure"
    builds: "Your data source, access route, timeline and plan B — the memo"
    reading: "TBD"
    due: "Data feasibility memo — outline, in class"

  - num: 11
    slug: "11-midterm-interrogating-data"
    date: 2026-11-04
    part: 4
    title: "Midterm and using data"
    desc: "The midterm asks you to design a study for a given situation in writing. Then the hands-on half: driving an assistant across real data, and the checks that catch a wrong answer without reading the code."
    goal: "Design a study in writing under exam conditions; then interrogate a real dataset through an assistant and catch something that is wrong with it."
    a: "**Midterm** — you are given a situation and asked to design a study to evaluate it, in writing: the question, the design, what data it requires, and what would undermine it"
    b: "Real data in front of you, and the checklist from meeting 9 put to work through an assistant: summaries, joins, quick plots. Then the harder half — knowing whether the answer is right without reading the code. Row counts across a join, totals against a published figure, five raw records read by hand. What not to upload, and why"
    builds: "Your own data, interrogated, and what is wrong with it"
    quizzes: 0
    reading: "Review"
    due: "Data feasibility memo — full, end of week"

  - num: 12
    slug: "12-seeing-data"
    date: 2026-11-11
    part: 5
    title: "Seeing the data"
    desc: "Which figure answers which question, and why. Exploring distributions, time, and space — then the flip side: what figures hide through aggregation, scale, binning, projection, and chosen windows."
    goal: "Choose the figure that answers your question, and read a published figure for what it is not showing."
    a: "Which figure answers which question, and why. Exploring distributions, time, and space; developing the instinct to be curious about a dataset before modelling it. Then the flip side: what figures hide — aggregation, scale, binning, projection, cherry-picked windows — and how to read a published figure for what it is not showing"
    b: "Rebuild a published figure from its underlying data, then produce the version you think is more honest. Then make the one figure your own project will live or die on — the picture that would show your effect if it is there — and bring it to the room"
    builds: "The one figure your project lives or dies on"
    reading: "TBD"
    due: "Design paper — outline · Writing 3 — plain-language summary · Exercise 1 — interrogate a dataset, end of week"

  - num: 13
    slug: "13-writing-collaboration"
    date: 2026-11-18
    part: 5
    title: "Writing the design paper"
    desc: "The design paper as a genre: how to write an identification section, and how to state a limitation without gutting your own project. Then how to referee somebody else's — which is the same skill from the other side — and how to keep a project reproducible."
    goal: "Write an identification section that names your design, its assumption, and what would break it — and state a limitation without gutting your own project."
    a: "Academic writing III — the design paper. The same method on a harder object: you outlined this two weeks ago, so today is what the identification section has to contain — the graph you drew in meeting 8, your design named, its assumption stated, and what would break it — and how to state a limitation without gutting your own project. Then reading for the skeleton one last time: what a referee actually looks for, which is how you will write your own referee report. If you cannot reconstruct a paper's outline, that is the finding. Then reproducibility at awareness level: where files live, naming, what 'the final version' means, and when version control is worth the cost"
    b: "Bring your sketch — topic sentences with the evidence noted under each, not prose. Workshop it in rotation: somebody else reads your skeleton and tells you where the argument jumps. Then each team presents its design and the assumption it is defending, and you rate your teammates for the second time"
    builds: "The whole paper, as a sketch, marked up by somebody else"
    reading: "TBD"
    due: "Design paper — sketch, marked up in class · Present your design · Rate your teammates · Exercise 2 — rebuild and critique a figure, end of week"
    reschedule: "Instructor traveling — moves to Nov 17 or Nov 19; date to be confirmed"

  - date: 2026-11-25
    note: "Thanksgiving recess — no class"

  - num: 14
    slug: "14-pitch"
    date: 2026-12-02
    part: 5
    title: "The pitch"
    desc: "Final presentations, and each team reviews another team's work. Then what your team owes AEM 6992 over the break."
