<style>
/* Meeting 8: bullets on slides that carry a figure or an animation are set
   at 80% so the figure, its controls and the source line fit. */
.reveal .slides section.slide.level2:has(> .m06) > ul,
.reveal .slides section.slide.level2:has(> .m06) > ol { font-size: 0.74em; }
/* Height caps per demo; the figure scales down and stays centered. */
.reveal .m06[data-demo="randomize"] .m06-svg { max-height: 262px; }
.reveal .m06[data-demo="balance"] .m06-svg { max-height: 236px; }
.reveal .m06[data-demo="iv"] .m06-svg { max-height: 198px; }
.reveal .m06[data-demo="weakiv"] .m06-svg { max-height: 238px; }
.reveal section.case ul { font-size: 0.94em; }
.reveal .m06[data-demo="rd"] .m06-svg { max-height: 232px; }
.reveal .m06[data-demo="arms"] .m06-svg { max-height: 222px; }
.reveal .m06[data-demo="geo"] .m06-svg { max-height: 175px; }
.reveal .m06[data-demo="dag"] .m06-svg { max-height: 258px; }
.reveal .m06[data-demo="dag"] .m06-controls { justify-content: center; }
.reveal .m06[data-demo="iv"] .m06-slider, .reveal .m06[data-demo="rd"] .m06-slider { width: 150px; }
/* The solution line on each failure slide. */
.reveal .slides section .solution { color: #b31b1b; }
/* Source lines are 0.55em links inside a full-size paragraph. Size the paragraph instead. */
.reveal .slides section p:has(> a[style*="font-size:0.55em"]) { font-size: 0.55em; line-height: 1.3; margin: 0.5em 0 0; }
.reveal .slides section p:has(> a[style*="font-size:0.55em"]) > a { font-size: 1em !important; }
</style>
