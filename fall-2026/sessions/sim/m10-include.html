<style>
/* Meeting 10: no demos. Shared slide rules from earlier meetings, plus the
   genre schematics, the boxes that hold hypothetical text, and the cells
   that wait for the instructor's lines on readers. */
.reveal .slides section.dense > ul, .reveal .slides section.dense > ol { font-size: 0.86em; }
/* The solution line on each problem slide. */
.reveal .slides section .solution { color: #b31b1b; }
/* Source lines are 0.55em links inside a full-size paragraph. Size the paragraph instead. */
.reveal .slides section p:has(> a[style*="font-size:0.55em"]) { font-size: 0.55em; line-height: 1.3; margin: 0.5em 0 0; }
.reveal .slides section p:has(> a[style*="font-size:0.55em"]) > a { font-size: 1em !important; }
.reveal .slides section .src { font-size: 0.55em; line-height: 1.3; color: #6b6b6b; margin: 0.5em 0 0; }

/* Hypothetical text: a ruled box with a small label, never quote marks. */
.reveal .m10-hyp {
  border-left: 4px solid #8a8a84;
  background: #f6f6f2;
  padding: 0.45em 0.8em 0.5em;
  margin: 0.2em 0 0.6em;
}
.reveal .m10-hyp::before {
  content: "Hypothetical";
  display: block;
  font-size: 0.55em;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #6b6b6b;
  margin-bottom: 0.2em;
}
.reveal .m10-hyp p { margin: 0; }
/* A phrase lifted from the hypothetical paragraph. */
.reveal .m10-phrase { background: #f3dede; padding: 0 0.2em; border-radius: 3px; }

/* Cells waiting for the instructor's lines. */
.reveal .m10-tbd { color: #b31b1b; font-style: italic; opacity: 0.75; }

/* Genre schematics: ordered boxes, the section name on the left and its job on the right. */
.reveal .m10-steps { list-style: none; margin: 0.2em 0 0.4em; padding: 0; counter-reset: step; }
.reveal .m10-steps li {
  counter-increment: step;
  display: flex;
  gap: 0.6em;
  align-items: baseline;
  border: 1.5px solid #c9c9c3;
  border-radius: 6px;
  padding: 0.14em 0.55em;
  margin: 0 0 0.22em;
  background: #fff;
}
.reveal .m10-steps li::before { content: counter(step); color: #6b6b6b; font-size: 0.8em; min-width: 1.1em; }
.reveal .m10-steps li b { min-width: 9.2em; }
.reveal .m10-steps li span { color: #343a40; }
.reveal .m10-steps li.v { border-color: #b31b1b; }
.reveal .m10-steps.two { columns: 2; column-gap: 0.8em; }
.reveal .m10-steps.two li { break-inside: avoid; }
.reveal .m10-steps.two li b { min-width: 0; }

/* Recap tables: a narrow number column, and the last column is the solution, in red. */
.reveal .m10-recap td:first-child, .reveal .m10-recap th:first-child { width: 1.5em; }
.reveal .m10-recap td:last-child, .reveal .m10-recap th:last-child { color: #b31b1b; }
/* Rule tables: a narrow number column. */
.reveal .m10-rules td:first-child, .reveal .m10-rules th:first-child { width: 1.5em; }
/* Two-column tables with a label on the left. */
.reveal .m10-two td:first-child { width: 30%; color: #343a40; }

/* Screenshots in columns, each framed and cropped to the same height. */
.reveal .m10-shot img { border: 1px solid #c9c9c3; max-height: 360px; width: 100%; object-fit: cover; object-position: top; margin: 0 0 0.2em; }
.reveal .m10-shot p { font-size: 0.5em; line-height: 1.3; color: #343a40; margin: 0; text-align: center; }
.reveal .m10-shot.short img { max-height: 290px; }

/* Verbatim text from a paper, set as a ruled block. */
.reveal .m10-quote { border-left: 4px solid #b31b1b; padding: 0.3em 0.8em; margin: 0.2em 0 0.5em; background: #fbf7f7; }
.reveal .m10-quote p { margin: 0 0 0.35em; }
/* A sentence added in revision. */
.reveal .m10-added { background: #e3efe0; padding: 0 0.2em; border-radius: 3px; }
.reveal .m10-phrase sup, .reveal .m10-added sup { color: #b31b1b; font-weight: 600; }

/* A skeptical reader's thought bubbles. */
.reveal .m10-bubble {
  position: relative; background: #fff; border: 2px solid #8a8a84; border-radius: 1.2em;
  padding: 0.35em 0.75em; margin: 0 0 0.85em 1.6em; font-size: 0.7em; line-height: 1.3;
}
.reveal .m10-bubble::before, .reveal .m10-bubble::after {
  content: ""; position: absolute; border: 2px solid #8a8a84; border-radius: 50%; background: #fff;
}
.reveal .m10-bubble::before { left: -1.05em; bottom: 0.35em; width: 0.6em; height: 0.6em; }
.reveal .m10-bubble::after { left: -1.6em; bottom: -0.05em; width: 0.32em; height: 0.32em; }
.reveal .m10-bubble b { color: #b31b1b; }

/* The funnel: bands narrowing toward the question, the paper's sentence beside each. */
.reveal .m10-funnel { display: grid; grid-template-columns: 38% 1fr; column-gap: 1em; row-gap: 0.3em; font-size: 0.6em; }
.reveal .m10-funnel .band {
  background: #b31b1b; color: #fff; font-weight: 600; display: flex; align-items: center;
  justify-content: center; text-align: center; margin: 0 auto; min-height: 3.2em;
}
.reveal .m10-funnel .b1 { width: 100%; clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%); }
.reveal .m10-funnel .b2 { width: 80%; opacity: 0.85; clip-path: polygon(0 0, 100% 0, 87.5% 100%, 12.5% 100%); }
.reveal .m10-funnel .b3 { width: 60%; opacity: 0.72; clip-path: polygon(0 0, 100% 0, 83.3% 100%, 16.7% 100%); }
.reveal .m10-funnel .b4 { width: 40%; opacity: 0.6; clip-path: polygon(0 0, 100% 0, 81.25% 100%, 18.75% 100%); }
.reveal .m10-funnel .q { display: flex; align-items: center; color: #343a40; }
.reveal .m10-funnel .q i { font-style: italic; }
/* The funnel's test, between what is missing and the question. */
.reveal .m10-funnel .m10-test {
  grid-column: 1 / -1; text-align: center; color: #b31b1b; background: #fbf1f1;
  border: 1.5px dashed #b31b1b; border-radius: 6px; padding: 0.25em 0.6em; font-size: 1.15em;
}

/* A reverse outline of a whole introduction: the paper on the left, the outline on the right. */
.reveal :is(.m10-ro, .m10-ol) { display: grid; grid-template-columns: 57% 1fr; gap: 18px; height: 505px; font-size: 15px; text-align: left; }
.reveal :is(.m10-ro, .m10-ol) .ro-page {
  overflow-y: auto; position: relative; background: #fff; border: 1px solid #d8d8d2;
  box-shadow: 0 2px 10px rgba(0,0,0,.14); padding: 16px 22px; color: #1b1b1b;
  font-family: Georgia, "Times New Roman", serif; line-height: 1.5; text-align: justify;
}
.reveal :is(.m10-ro, .m10-ol) .ro-paper { font-weight: 700; font-size: 15px; line-height: 1.3; }
.reveal :is(.m10-ro, .m10-ol) .ro-authors { font-size: 12px; color: #6b6b6b; margin: 4px 0 10px; }
.reveal :is(.m10-ro, .m10-ol) .ro-sec { font-weight: 700; margin-bottom: 6px; }
.reveal :is(.m10-ro, .m10-ol) .ro-p { margin: 0 0 10px; text-indent: 1.2em; font-size: 15px; line-height: 1.5; transition: opacity .2s; }
.reveal :is(.m10-ro, .m10-ol) .ro-s { border-radius: 3px; transition: background .15s; cursor: default; }
.reveal :is(.m10-ro, .m10-ol) .ro-s.ro-first { text-decoration: underline; text-decoration-color: #8a8a84; text-underline-offset: 3px; }
.reveal :is(.m10-ro, .m10-ol) .ro-s.ro-on { background: #fff1b8; }
.reveal :is(.m10-ro, .m10-ol) .ro-p.ro-dim { opacity: .22; }
.reveal :is(.m10-ro, .m10-ol) .ro-p.ro-focus .ro-point { background: #f3dede; }
.reveal :is(.m10-ro, .m10-ol) .ro-s.ro-role { background: color-mix(in srgb, var(--ro-col) 24%, white); }
.reveal :is(.m10-ro, .m10-ol) .ro-side { display: flex; flex-direction: column; gap: 8px; min-height: 0; font-size: 14px; }
.reveal :is(.m10-ro, .m10-ol) .ro-outline { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
.reveal :is(.m10-ro, .m10-ol) .ro-row {
  display: flex; gap: 8px; padding: 4px 8px; margin: 0 0 4px; border: 1px solid #e3e3de;
  border-radius: 6px; line-height: 1.25; font-size: 13px; cursor: default;
}
.reveal :is(.m10-ro, .m10-ol) .ro-row:hover { border-color: #b31b1b; background: #fbf7f7; }
.reveal :is(.m10-ro, .m10-ol) .ro-num { font-weight: 700; color: #b31b1b; min-width: 1em; }
.reveal :is(.m10-ro, .m10-ol) .ro-sum { display: block; }
.reveal :is(.m10-ro, .m10-ol) .ro-at { display: block; font-size: 11px; color: #b31b1b; margin-top: 2px; }
.reveal :is(.m10-ro, .m10-ol) .ro-at.ro-first-ok { color: #3f7d3a; }
.reveal :is(.m10-ro, .m10-ol) .ro-missing { border-style: dashed; color: #7e1313; }
.reveal :is(.m10-ro, .m10-ol) .ro-info { min-height: 46px; border-top: 1px solid #e3e3de; padding-top: 6px; line-height: 1.3; }
.reveal :is(.m10-ro, .m10-ol) .ro-chip {
  display: inline-block; color: #fff; font-size: 11px; font-weight: 600; line-height: 1.5;
  border-radius: 10px; padding: 0 8px; margin: 0 4px 4px 0; cursor: default;
}
.reveal :is(.m10-ro, .m10-ol) .ro-where { font-size: 12px; color: #6b6b6b; }
.reveal :is(.m10-ro, .m10-ol) .ro-does { margin-top: 2px; }
.reveal :is(.m10-ro, .m10-ol) .ro-legend { line-height: 1.2; }

/* The 2021 paper rebuilt as an outline: same panels, with sections, evidence and lengths. */
.reveal .m10-ol { grid-template-columns: 55% 1fr; height: 520px; }
.reveal .m10-ol .ro-p { position: relative; }
.reveal .m10-ol .ro-p.ro-focus .ro-point,
.reveal .m10-ol .ro-p:hover .ro-point { background: #f3dede; }
.reveal .m10-ol .ol-pn {
  position: absolute; left: -18px; top: 2px; text-indent: 0; font: 700 11px/1 "Source Sans Pro", Helvetica, sans-serif; color: #b31b1b;
}
.reveal .m10-ol .ro-page { padding-left: 26px; }
.reveal .m10-ol .ro-eq { display: block; text-align: center; text-indent: 0; margin: 4px 0; white-space: nowrap; font-size: 14px; }
.reveal .m10-ol .ol-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b6b6b; }
.reveal .m10-ol .ro-outline { position: relative; flex: 1; border: 1.5px dashed #b8b8b0; border-radius: 6px; padding: 6px; }
.reveal .m10-ol .ol-sec { font-size: 12px; font-weight: 700; color: #1b1b1b; margin: 6px 0 3px; }
.reveal .m10-ol .ol-sec:first-child { margin-top: 0; }
.reveal .m10-ol .ro-row { padding: 3px 7px; margin-bottom: 3px; font-size: 12.5px; }
.reveal .m10-ol .ro-row.ro-cur { border-color: #b31b1b; background: #fbf7f7; }
.reveal .m10-ol .ol-ev { display: block; font-size: 11px; color: #6b6b6b; margin-top: 1px; }
.reveal .m10-ol .ro-info { min-height: 0; font-size: 12.5px; color: #1b1b1b; }

/* A bullet and the paragraph written from it. */
.reveal .m10-bulletpara .lbl { display: block; font-size: 0.85em; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #6b6b6b; margin: 0.3em 0 0.2em; }
.reveal .m10-bulletpara .m10-plan { border: 1.5px dashed #b8b8b0; border-radius: 6px; padding: 0.3em 0.7em; margin-bottom: 0.4em; }
.reveal .m10-bulletpara .m10-plan p { margin: 0; }
.reveal .m10-bulletpara .m10-quote p { line-height: 1.45; }
.reveal .m10-bulletpara .m10-quote :is(.k1, .k2, .k3) { padding: 0; }
.reveal .m10-bulletpara .k1 { background: #f3dede; border-radius: 3px; padding: 0 0.15em; }
.reveal .m10-bulletpara .k2 { background: #fff1b8; border-radius: 3px; padding: 0 0.15em; }
.reveal .m10-bulletpara .k3 { background: #e3efe0; border-radius: 3px; padding: 0 0.15em; }
</style>
<script src="sim/m10-reverse.js"></script>
<script src="sim/m10-ncc-data.js"></script>
<script src="sim/m10-outline.js"></script>
